<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKLES Ops Board</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#f4efe4; --surface:#ffffff; --surface2:#fbf8f1;
    --navy:#112250; --navy2:#1b2f5e; --ink:#0a1533;
    --tan:#E0C58F; --tan-deep:#a8823f;
    --text:#1e2a44; --muted:#5d6b7e; --line:#e6dfce;
    --shadow:0 8px 26px rgba(17,34,80,.08);
    --yt:#c0392b; --social:#2f80c9; --funnel:#2fa37a;
    --ev-web:#5a5fc7; --ev-meet:#c99a3f;
    --p-founder:#c99a3f; --p-recog:#2fa37a; --p-proof:#3f78c9;
    --p-blueprint:#8a63c0; --p-funnel:#c2762f; --p-problem:#c25b4e; --p-video:#c0392b;
    --p-email:#c2762f; --p-lp:#8a63c0;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0b1430; --surface:#152449; --surface2:#101d3e;
    --text:#e9edf6; --muted:#9fb0c7; --line:#26386a; --tan-deep:#E0C58F;
    --shadow:0 8px 26px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0b1430; --surface:#152449; --surface2:#101d3e;
    --text:#e9edf6; --muted:#9fb0c7; --line:#26386a; --tan-deep:#E0C58F;
    --shadow:0 8px 26px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',system-ui,Arial,sans-serif;font-size:15px}
  h1,h2,h3{font-family:'Merriweather',Georgia,serif;margin:0}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}

  header{background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;padding:18px 26px 16px}
  .htop{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1560px;margin:0 auto}
  .brand{font-family:'Merriweather',serif;font-weight:900;font-size:22px}
  .brand .g{color:var(--tan)}
  .brand .sub{font-size:12px;color:#aeb9d0;font-family:'Poppins';font-weight:500;margin-top:2px}
  .theme-btn{background:rgba(224,197,143,.12);border:1px solid rgba(224,197,143,.35);color:var(--tan);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600}

  main{max-width:1560px;margin:0 auto;padding:18px 26px 60px}
  .bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:none;padding:9px 15px;font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
  .seg button .dot{width:9px;height:9px;border-radius:50%}
  .seg.channels button.on{background:var(--navy);color:#fff}
  .seg.views button.on{background:var(--tan);color:var(--navy)}
  .seg.right button.on{background:var(--p-problem);color:#fff}
  .spacer{flex:1}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600}
  .chip.on{background:var(--tan);border-color:var(--tan);color:var(--navy)}
  .btn{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .saved{font-size:12px;color:var(--muted)}

  /* KANBAN */
  .board{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .col{background:var(--surface2);border:1px solid var(--line);border-radius:14px;min-width:290px;width:290px;flex:0 0 auto;display:flex;flex-direction:column}
  .colhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}
  .colhead .ct{font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--text)}
  .colhead .cnt{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-weight:700}
  .cards{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px;min-height:40px}
  .cards.dragover{background:rgba(224,197,143,.12);border-radius:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;border-left:4px solid var(--tan)}
  .card:hover{border-color:var(--tan)}
  .card .cm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .card .date{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px}
  .card .star{color:var(--p-recog);font-size:13px}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;color:#fff}
  .card .hook{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--text);margin:7px 0 6px}
  .card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .chans{display:flex;gap:4px;flex-wrap:wrap}
  .ch{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
  .owner{font-size:10.5px;font-weight:700;color:var(--tan-deep)}
  .badges{display:flex;gap:6px;margin-top:6px}
  .mini{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}

  /* LIST */
  .listwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  table.list{border-collapse:collapse;width:100%;min-width:1000px;background:var(--surface)}
  table.list th{background:var(--navy);color:#fff;font-size:11px;letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:12px 14px;font-family:'Poppins';font-weight:700}
  table.list td{padding:11px 14px;border-top:1px solid var(--line);font-size:13px;vertical-align:top}
  table.list tr{cursor:pointer}
  table.list tbody tr:hover td{background:var(--surface2)}
  table.list .l-date{white-space:nowrap;font-weight:700;color:var(--muted)}
  table.list .l-hook{font-weight:600;color:var(--text);max-width:340px}
  .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .st-tag{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

  /* CALENDAR */
  .calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .cal{min-width:1120px;background:var(--surface)}
  .calhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px}
  .calhead h2{font-size:20px;color:var(--text)}
  .callegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .callegend span{display:inline-flex;align-items:center;gap:5px}
  .lg{width:10px;height:10px;border-radius:3px;display:inline-block}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cdow{padding:10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  .cday{min-height:128px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px}
  .cday:nth-child(7n){border-right:none}
  .cday.out{background:var(--surface2);opacity:.5}
  .cday .dn{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .cday.today .dn{color:var(--tan-deep)}
  .cev{font-size:10.5px;font-weight:700;border-radius:5px;padding:3px 6px;margin-bottom:3px;color:#fff;line-height:1.3}
  .cev.webinar{background:var(--ev-web)} .cev.meeting{background:var(--ev-meet)}
  .ci{font-size:10.5px;line-height:1.32;border-radius:5px;padding:3px 6px;margin-bottom:3px;color:#fff;cursor:pointer}

  /* FEEDBACK */
  .fbwrap{display:grid;grid-template-columns:340px 1fr;gap:22px}
  .card2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--tan-deep);margin:0 0 8px}
  .card2 h2{font-size:19px;margin-bottom:6px;color:var(--text)}
  .fb-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);margin-bottom:12px;border-left:4px solid var(--tan)}
  .fb-item.done{opacity:.6;border-left-color:var(--p-recog)}
  .fb-item .txt{font-size:14px;line-height:1.5;color:var(--text)}
  .fb-item .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .fb-item .acts{display:flex;gap:10px}
  .link{background:none;border:none;color:var(--p-problem);font-size:12px;font-weight:700;padding:0}
  .link.ok{color:var(--p-recog)}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(10,21,51,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .ov.on{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:540px;box-shadow:0 30px 70px rgba(0,0,0,.4);max-height:92vh;overflow:auto}
  .modal h3{font-size:18px;margin-bottom:4px}
  .modal .msub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:9px 11px}
  .fld textarea{min-height:64px;resize:vertical}
  .modrow{display:flex;gap:10px}
  .sechead{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tan-deep);margin:20px 0 8px;border-top:1px solid var(--line);padding-top:16px}
  .subitem{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:13px}
  .subitem .x{color:var(--p-problem);font-weight:700;cursor:pointer;flex:0 0 auto}
  .subitem a{color:var(--p-proof);font-weight:600;text-decoration:none;word-break:break-all}
  .subitem .who{font-size:10.5px;color:var(--muted);font-weight:700}
  .addrow{display:flex;gap:8px;margin-top:6px}
  .addrow input{flex:1}
  .addrow .btn{padding:9px 13px}
  .modact{display:flex;justify-content:space-between;gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}

  @media (max-width:820px){ .fbwrap{grid-template-columns:1fr} }
</style>

<header>
  <div class="htop">
    <div>
      <div class="brand">SKLES<span class="g">.</span> Ops Board</div>
      <div class="sub">Content &amp; funnel planner</div>
    </div>
    <button class="theme-btn" id="themeBtn">◐ Theme</button>
  </div>
</header>

<main>
  <div class="bar">
    <div class="seg channels" id="channelSeg"></div>
    <div class="seg views" id="viewSeg"></div>
    <div class="seg right"><button id="fbTab">💬 Feedback</button></div>
    <div class="spacer"></div>
    <span class="saved" id="saved"></span>
    <button class="btn" id="addCard">+ Add</button>
    <button class="btn ghost" id="resetBtn">Reset</button>
  </div>
  <div class="filters" id="pillarFilters" style="margin-bottom:16px"></div>

  <div id="work"></div>

  <div id="feedback-view" style="display:none">
    <div class="fbwrap">
      <div class="card2">
        <p class="eyebrow">Tool backlog</p>
        <h2>Tell us what to improve</h2>
        <p style="color:var(--muted);font-size:13px;margin:4px 0 14px">Anything missing or clunky in this board? Drop it here and it becomes our backlog.</p>
        <div class="fld"><label>Your name</label><input id="fb-by" placeholder="e.g. Valerie"></div>
        <div class="fld"><label>What needs improving</label><textarea id="fb-txt" placeholder="e.g. I'd like to filter by owner"></textarea></div>
        <button class="btn" id="fb-add" style="width:100%">Add to backlog</button>
      </div>
      <div><div id="fb-list"></div></div>
    </div>
  </div>
</main>

<div class="ov" id="ov">
  <div class="modal">
    <h3 id="modTitle">Edit card</h3>
    <div class="msub" id="modSub"></div>
    <div class="fld"><label>Hook / headline</label><input id="f-hook"></div>
    <div class="fld"><label>Copy / caption</label><textarea id="f-copy"></textarea></div>
    <div class="modrow">
      <div class="fld" style="flex:1"><label>Board</label><select id="f-board"></select></div>
      <div class="fld" style="flex:1"><label>Pillar</label><select id="f-pillar"></select></div>
    </div>
    <div class="modrow">
      <div class="fld" style="flex:1"><label>Format</label><input id="f-fmt"></div>
      <div class="fld" style="flex:1"><label>Date</label><input id="f-date" type="date"></div>
    </div>
    <div class="modrow">
      <div class="fld" style="flex:1"><label>Owner</label><input id="f-owner"></div>
      <div class="fld" style="flex:1"><label>Status</label><select id="f-status"></select></div>
    </div>
    <div class="modrow">
      <div class="fld" style="flex:1"><label>CTA</label><input id="f-cta"></div>
      <div class="fld" style="flex:1"><label>Channels (comma)</label><input id="f-chans" placeholder="IG, TikTok"></div>
    </div>
    <div class="fld"><label>Visual / asset note</label><input id="f-visual"></div>
    <div class="fld"><label>Link (draft, doc, post URL)</label><input id="f-link" placeholder="https://"></div>

    <div class="sechead">Attachments</div>
    <div id="att-list"></div>
    <div class="addrow">
      <input id="att-label" placeholder="Label (e.g. Canva draft)">
      <input id="att-url" placeholder="https://">
      <button class="btn" id="att-add">Add</button>
    </div>

    <div class="sechead">Comments</div>
    <div id="cmt-list"></div>
    <div class="addrow">
      <input id="cmt-by" placeholder="You" style="flex:0 0 90px">
      <input id="cmt-txt" placeholder="Add a comment">
      <button class="btn" id="cmt-add">Post</button>
    </div>

    <div class="modact">
      <button class="link" id="f-del">Delete card</button>
      <div><button class="btn ghost" id="f-cancel">Cancel</button> <button class="btn" id="f-save">Save</button></div>
    </div>
  </div>
</div>

<script>
const BOARDS=[{id:'all',name:'All'},{id:'youtube',name:'YouTube'},{id:'social',name:'Social'},{id:'funnel',name:'Funnel'}];
const BCOLOR={youtube:'--yt',social:'--social',funnel:'--funnel'};
const VIEWS=[{id:'list',name:'List'},{id:'calendar',name:'Calendar'},{id:'kanban',name:'Kanban'}];
const STATUS=['Ideas','To Produce','Scheduled','Published'];
const PILLARS={'Founder Story':'--p-founder','Problem → Solution':'--p-problem','Proof / Math':'--p-proof','6-Step Blueprint':'--p-blueprint','Recognition':'--p-recog','Funnel Push':'--p-funnel','Video':'--p-video','Email':'--p-email','Landing page':'--p-lp'};
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

const EVENTS=[
  {date:'2026-09-02',label:'🎥 Recorded webinar',type:'webinar'},
  {date:'2026-09-09',label:'🎥 Recorded webinar',type:'webinar'},
  {date:'2026-09-10',label:'👥 Coaching meeting',type:'meeting'},
  {date:'2026-09-16',label:'🎥 Recorded webinar',type:'webinar'},
  {date:'2026-09-23',label:'🎥 Recorded webinar',type:'webinar'},
  {date:'2026-09-24',label:'👥 Coaching meeting',type:'meeting'},
  {date:'2026-09-30',label:'🎥 Recorded webinar',type:'webinar'}
];
function iso(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

function seedCards(){
  const c=[]; let id=1; let shortN=0;
  const mk=o=>Object.assign({comments:[],attachments:[],link:'',visual:'',status:'To Produce'},o);
  const weeks=[1,8,15,22,29];
  const themes=['The 50-year plan is broken','One deal, real numbers','Start without cash or credit','Live well by doing good','Two choices'];
  const social=[
    {off:0,pillar:'Founder Story',fmt:'Reel',chans:['IG','TikTok','FB'],owner:'Sean → Valerie',cta:'—',
     hook:t=>t, copy:t=>`Sean, first person: the story behind "${t.toLowerCase()}". Specific and honest, no hype.`, visual:'Talking-head Reel, captions burned in.'},
    {off:1,pillar:'Recognition',fmt:'Carousel',chans:['IG','FB','LinkedIn'],owner:'Valerie',boost:true,cta:'—',
     hook:t=>'Member spotlight', copy:t=>`Celebrate a member win or a Sean listing tied to "${t.toLowerCase()}". Boost on Tuesday. ★`, visual:'Carousel: quote card + proof shot.'},
    {off:2,pillar:'Proof / Math',fmt:'Reel',chans:['IG','TikTok','FB'],owner:'Valerie',cta:'Free guide',
     hook:t=>`The math on ${t.toLowerCase()}`, copy:t=>'Show real numbers: equity built, cash flow, "rent is 100% interest".', visual:'Reel with number overlays.'},
    {off:3,pillar:'Funnel Push',fmt:'Story',chans:['IG','FB'],owner:'Valerie',cta:'Webinar',
     hook:t=>'Your next step', copy:t=>'Drive to the free guide and the recorded webinar. Register link.', visual:'Story with link sticker + countdown.'},
    {off:4,pillar:'Proof / Math',fmt:'Post',chans:['LinkedIn'],owner:'Valerie',cta:'—',
     hook:t=>`${t} — for professionals`, copy:t=>'Native LinkedIn text post, no outbound link in the body. Reframe the week’s proof for a pro audience.', visual:'Native text + single image.'}
  ];
  weeks.forEach((mon,wi)=>{
    const t=themes[wi];
    social.forEach(r=>{const d=mon+r.off; if(d>30)return;
      c.push(mk({id:id++,board:'social',date:iso(2026,9,d),pillar:r.pillar,fmt:r.fmt,chans:r.chans,owner:r.owner,cta:r.cta,boost:!!r.boost,hook:r.hook(t),copy:r.copy(t),visual:r.visual}));});
    if(mon<=29){
      c.push(mk({id:id++,board:'youtube',date:iso(2026,9,mon+1),pillar:'Video',fmt:'Long-form',chans:['YouTube'],owner:'Sean · Marissa',cta:'Subscribe',hook:`Renovation walkthrough — ${t}`,copy:'Full walkthrough tied to the week’s theme. Pull 2–3 Shorts out of it.',visual:'16:9, chaptered, b-roll of the property.'}));
      [1,2].forEach(k=>{shortN++;const day=mon+(k===1?2:4);
        c.push(mk({id:id++,board:'youtube',date:iso(2026,9,day),pillar:'Video',fmt:'Short',chans:['YouTube','TikTok'],owner:'Marissa',cta:'Subscribe',hook:`Investor Rule #${shortN}`,copy:'One rule in ~30s. Hook in the first 2 seconds, vertical.',visual:'9:16 Short, big captions.'}));});
    }
  });
  const funnel=[
    {d:1,pillar:'Landing page',fmt:'LP',owner:'Marina',hook:'Ebook LP — add testimonials + FAQ',copy:'Add member testimonials and an FAQ block, tighten the form. Lift landing-page conversion.',cta:'—'},
    {d:3,pillar:'Email',fmt:'Automation',owner:'Marina',hook:'Audit nurture Phase A/B',copy:'Opens are healthy, clicks are not. Rewrite the low-click CTAs across the flow.',cta:'—'},
    {d:8,pillar:'Funnel Push',fmt:'Ad',owner:'Marina',hook:'Test direct-to-webinar ad',copy:'Split from, or add to, the ebook campaign. Send colder traffic straight to the recorded webinar.',cta:'Register'},
    {d:11,pillar:'Email',fmt:'Broadcast',owner:'Marina',hook:'Monthly newsletter broadcast',copy:'One-time send to the whole list. Value first, webinar invite second.',cta:'Webinar'},
    {d:15,pillar:'Funnel Push',fmt:'Ad',owner:'Marina · Sean',hook:'Turn on retargeting',copy:'Accept the web-audience terms, then retarget site + engagement audiences at a low daily budget.',cta:'—'},
    {d:22,pillar:'Email',fmt:'Automation',owner:'Marina',hook:'Webinar reminder + replay sequence',copy:'Get registrants to actually watch: reminder before, replay link after for no-shows.',cta:'Watch'},
    {d:29,pillar:'Email',fmt:'Broadcast',owner:'Marina',hook:'End-of-month recap + next invite',copy:'Recap the month’s wins and invite to the next webinar.',cta:'Register'}
  ];
  funnel.forEach(f=>c.push(mk({id:id++,board:'funnel',date:iso(2026,9,f.d),pillar:f.pillar,fmt:f.fmt,chans:[],owner:f.owner,cta:f.cta,hook:f.hook,copy:f.copy,visual:''})));
  return c;
}

const LS='skles_ops_v3', LSF='skles_ops_fb_v1';
let cards=load(LS)||seedCards();
let feedback=load(LSF)||[];
let channel='all', view='calendar', filter=null, editing=null, showFb=false;

function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(LS,JSON.stringify(cards));flash('Saved ✓');}catch(e){flash('(not saved)');}}
function saveFb(){try{localStorage.setItem(LSF,JSON.stringify(feedback));}catch(e){}}
function flash(t){const e=document.getElementById('saved');if(e){e.textContent=t;setTimeout(()=>{if(e.textContent===t)e.textContent='';},1600);}}
function pcolor(p){return css(PILLARS[p]||'--tan');}
function bcolor(b){return css(BCOLOR[b]||'--tan');}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function fdate(s){if(!s)return '';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function inScope(c){return (channel==='all'||c.board===channel) && (!filter||c.pillar===filter);}

/* ---- KANBAN ---- */
function renderKanban(el){
  const b=document.createElement('div');b.className='board';
  STATUS.forEach(st=>{
    let list=cards.filter(c=>inScope(c)&&c.status===st).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const col=document.createElement('div');col.className='col';
    col.innerHTML=`<div class="colhead"><span class="ct">${st}</span><span class="cnt num">${list.length}</span></div>
      <div class="cards" data-st="${st}">${list.map(cardHTML).join('')}</div>`;
    b.appendChild(col);
  });
  el.appendChild(b);
  wireDnD();bindCards();
}
function cardHTML(c){
  const chans=(c.chans||[]).map(x=>`<span class="ch">${x}</span>`).join('')||`<span class="ch">${esc(c.fmt)}</span>`;
  const nc=(c.comments||[]).length, na=(c.attachments||[]).length;
  const badges=[nc?`<span class="mini">💬 ${nc}</span>`:'',na?`<span class="mini">📎 ${na}</span>`:''].join('');
  return `<div class="card" data-id="${c.id}" draggable="true" style="border-left-color:${pcolor(c.pillar)}">
    <div class="cm"><span class="date">${c.date?fdate(c.date):'—'}</span>${c.boost?'<span class="star">★</span>':''}</div>
    <span class="pill" style="background:${pcolor(c.pillar)}">${c.pillar}</span>
    <div class="hook">${esc(c.hook||c.copy)}</div>
    <div class="foot"><div class="chans">${chans}</div><span class="owner">${esc(c.owner)}</span></div>
    ${badges?`<div class="badges">${badges}</div>`:''}
  </div>`;
}
function wireDnD(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',e=>{e.dataTransfer.setData('id',card.dataset.id);card.style.opacity=.4;});
    card.addEventListener('dragend',()=>card.style.opacity=1);
  });
  document.querySelectorAll('.cards').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('dragover');});
    z.addEventListener('dragleave',()=>z.classList.remove('dragover'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('dragover');
      const c=cards.find(x=>x.id===+e.dataTransfer.getData('id'));if(!c)return;c.status=z.dataset.st;save();render();});
  });
}
function bindCards(){document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openModal(+c.dataset.id)));}

/* ---- LIST ---- */
function renderList(el){
  let list=cards.filter(inScope).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const rows=list.map(c=>`<tr data-id="${c.id}">
    <td class="l-date">${c.date?fdate(c.date):'—'}</td>
    <td><span class="cdot" style="background:${bcolor(c.board)}"></span>${BOARDS.find(b=>b.id===c.board).name}</td>
    <td><span class="st-tag" style="border-color:${pcolor(c.pillar)};color:${pcolor(c.pillar)}">${c.pillar}</span></td>
    <td>${esc(c.fmt)}</td>
    <td class="l-hook">${esc(c.hook||c.copy)}${c.boost?' ★':''}</td>
    <td>${esc(c.cta||'—')}</td>
    <td>${esc(c.owner)}</td>
    <td><span class="st-tag">${c.status}</span></td>
  </tr>`).join('');
  el.innerHTML=`<div class="listwrap"><table class="list">
    <thead><tr><th>Date</th><th>Board</th><th>Pillar</th><th>Format</th><th>Hook / brief</th><th>CTA</th><th>Owner</th><th>Status</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px">No cards in this view.</td></tr>'}</tbody>
  </table></div>`;
  el.querySelectorAll('tbody tr[data-id]').forEach(r=>r.addEventListener('click',()=>openModal(+r.dataset.id)));
}

/* ---- CALENDAR ---- */
function renderCal(el){
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells=dows.map(d=>`<div class="cdow">${d}</div>`).join('');
  const startDow=new Date(2026,8,1).getDay();
  const arr=[];for(let i=0;i<startDow;i++)arr.push(null);for(let d=1;d<=30;d++)arr.push(d);while(arr.length%7)arr.push(null);
  const today=new Date();
  arr.forEach(d=>{
    if(d===null){cells+=`<div class="cday out"></div>`;return;}
    const ds=iso(2026,9,d);
    const evs=EVENTS.filter(e=>e.date===ds).map(e=>`<div class="cev ${e.type}">${e.label}</div>`).join('');
    const items=cards.filter(c=>c.date===ds&&inScope(c)).map(c=>`<div class="ci" data-id="${c.id}" style="background:${bcolor(c.board)}" title="${esc(c.hook)}">${esc(c.hook||c.copy)}</div>`).join('');
    const isT=(today.getFullYear()===2026&&today.getMonth()===8&&today.getDate()===d);
    cells+=`<div class="cday${isT?' today':''}"><div class="dn">${d}</div>${evs}${items}</div>`;
  });
  el.innerHTML=`<div class="calwrap"><div class="cal">
    <div class="calhead"><h2>September 2026</h2>
      <div class="callegend">
        <span><span class="lg" style="background:var(--yt)"></span>YouTube</span>
        <span><span class="lg" style="background:var(--social)"></span>Social</span>
        <span><span class="lg" style="background:var(--funnel)"></span>Funnel</span>
        <span><span class="lg" style="background:var(--ev-web)"></span>Webinar</span>
        <span><span class="lg" style="background:var(--ev-meet)"></span>Meeting</span>
      </div></div>
    <div class="calgrid">${cells}</div>
  </div></div>`;
  el.querySelectorAll('.ci').forEach(x=>x.addEventListener('click',()=>openModal(+x.dataset.id)));
}

/* ---- FEEDBACK ---- */
function renderFb(){
  const l=document.getElementById('fb-list');
  if(!feedback.length){l.innerHTML='<div class="card2" style="color:var(--muted)">No feedback yet. Be the first to add one.</div>';return;}
  l.innerHTML=feedback.map((f,i)=>`<div class="fb-item ${f.done?'done':''}">
    <div class="txt">${esc(f.txt)}</div>
    <div class="meta"><span>${esc(f.by||'Anon')} · ${f.at}</span>
      <span class="acts"><button class="link ok" data-t="${i}">${f.done?'Reopen':'Mark done'}</button><button class="link" data-d="${i}">Delete</button></span>
    </div></div>`).join('');
  l.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{feedback[+b.dataset.t].done=!feedback[+b.dataset.t].done;saveFb();renderFb();});
  l.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{feedback.splice(+b.dataset.d,1);saveFb();renderFb();});
}
document.getElementById('fb-add').onclick=()=>{
  const txt=document.getElementById('fb-txt').value.trim();if(!txt)return;
  const by=document.getElementById('fb-by').value.trim();
  feedback.unshift({txt,by,at:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),done:false});
  saveFb();document.getElementById('fb-txt').value='';renderFb();
};

/* ---- MODAL ---- */
function openModal(id){
  editing = id? JSON.parse(JSON.stringify(cards.find(c=>c.id===id))) : {id:Math.max(0,...cards.map(c=>c.id))+1,board:(channel==='all'?'social':channel),date:'',pillar:'Founder Story',fmt:'Reel',chans:[],owner:'',cta:'—',hook:'',copy:'',visual:'',link:'',status:'Ideas',comments:[],attachments:[],isNew:true};
  document.getElementById('modTitle').textContent=id?'Edit card':'New card';
  document.getElementById('modSub').textContent=BOARDS.find(b=>b.id===editing.board).name+' board';
  g('f-hook').value=editing.hook||''; g('f-copy').value=editing.copy||'';
  g('f-board').innerHTML=BOARDS.filter(b=>b.id!=='all').map(b=>`<option value="${b.id}"${b.id===editing.board?' selected':''}>${b.name}</option>`).join('');
  g('f-pillar').innerHTML=Object.keys(PILLARS).map(p=>`<option${p===editing.pillar?' selected':''}>${p}</option>`).join('');
  g('f-status').innerHTML=STATUS.map(s=>`<option${s===editing.status?' selected':''}>${s}</option>`).join('');
  g('f-fmt').value=editing.fmt||''; g('f-date').value=editing.date||''; g('f-owner').value=editing.owner||'';
  g('f-cta').value=editing.cta||''; g('f-chans').value=(editing.chans||[]).join(', ');
  g('f-visual').value=editing.visual||''; g('f-link').value=editing.link||'';
  g('f-del').style.visibility=id?'visible':'hidden';
  renderAtt();renderCmt();
  document.getElementById('ov').classList.add('on');
}
function g(i){return document.getElementById(i);}
function renderAtt(){
  const l=g('att-list');const a=editing.attachments||[];
  l.innerHTML=a.map((x,i)=>`<div class="subitem"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label||x.url)}</a><span class="x" data-i="${i}">✕</span></div>`).join('');
  l.querySelectorAll('.x').forEach(b=>b.onclick=()=>{editing.attachments.splice(+b.dataset.i,1);renderAtt();});
}
g('att-add').onclick=()=>{const label=g('att-label').value.trim(),url=g('att-url').value.trim();if(!url)return;
  editing.attachments=editing.attachments||[];editing.attachments.push({label,url});g('att-label').value='';g('att-url').value='';renderAtt();};
function renderCmt(){
  const l=g('cmt-list');const cm=editing.comments||[];
  l.innerHTML=cm.map((x,i)=>`<div class="subitem"><span><span class="who">${esc(x.by||'—')}</span> · ${esc(x.text)}</span><span class="x" data-i="${i}">✕</span></div>`).join('');
  l.querySelectorAll('.x').forEach(b=>b.onclick=()=>{editing.comments.splice(+b.dataset.i,1);renderCmt();});
}
g('cmt-add').onclick=()=>{const by=g('cmt-by').value.trim(),text=g('cmt-txt').value.trim();if(!text)return;
  editing.comments=editing.comments||[];editing.comments.push({by,text});g('cmt-txt').value='';renderCmt();};

g('f-save').onclick=()=>{
  if(!editing)return;
  editing.hook=g('f-hook').value; editing.copy=g('f-copy').value; editing.board=g('f-board').value;
  editing.pillar=g('f-pillar').value; editing.status=g('f-status').value; editing.fmt=g('f-fmt').value;
  editing.date=g('f-date').value; editing.owner=g('f-owner').value; editing.cta=g('f-cta').value;
  editing.chans=g('f-chans').value.split(',').map(s=>s.trim()).filter(Boolean);
  editing.visual=g('f-visual').value; editing.link=g('f-link').value;
  const isNew=editing.isNew; delete editing.isNew;
  if(isNew){cards.push(editing);} else {const i=cards.findIndex(c=>c.id===editing.id);if(i>=0)cards[i]=editing;}
  save();render();closeModal();
};
g('f-del').onclick=()=>{if(editing){cards=cards.filter(c=>c.id!==editing.id);save();render();closeModal();}};
g('f-cancel').onclick=closeModal;
function closeModal(){document.getElementById('ov').classList.remove('on');editing=null;}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')closeModal();};
document.getElementById('addCard').onclick=()=>openModal(null);
document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset to the seeded Sept plan? Your changes will be lost.')){cards=seedCards();save();render();}};

/* ---- CHROME ---- */
function renderChannels(){
  const b=document.getElementById('channelSeg');
  b.innerHTML=BOARDS.map(bd=>`<button data-b="${bd.id}" class="${bd.id===channel&&!showFb?'on':''}">${bd.id!=='all'?`<span class="dot" style="background:${bcolor(bd.id)}"></span>`:''}${bd.name}</button>`).join('');
  b.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{channel=btn.dataset.b;filter=null;showFb=false;render();});
}
function renderViews(){
  const b=document.getElementById('viewSeg');
  b.innerHTML=VIEWS.map(v=>`<button data-v="${v.id}" class="${v.id===view&&!showFb?'on':''}">${v.name}</button>`).join('');
  b.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{view=btn.dataset.v;showFb=false;render();});
}
function renderFilters(){
  if(showFb){document.getElementById('pillarFilters').innerHTML='';return;}
  const used=[...new Set(cards.filter(c=>channel==='all'||c.board===channel).map(c=>c.pillar))];
  const box=document.getElementById('pillarFilters');
  box.innerHTML='<span class="chip'+(!filter?' on':'')+'" data-p="">All pillars</span>'+used.map(p=>`<span class="chip${filter===p?' on':''}" data-p="${p}" style="${filter===p?'':'border-left:3px solid '+pcolor(p)}">${p}</span>`).join('');
  box.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filter=ch.dataset.p||null;render();});
}
document.getElementById('fbTab').onclick=()=>{showFb=!showFb;render();};

function render(){
  renderChannels();renderViews();renderFilters();
  document.getElementById('fbTab').classList.toggle('on',showFb);
  const w=document.getElementById('work'), f=document.getElementById('feedback-view');
  const showAdd=!showFb; document.getElementById('addCard').style.display=showAdd?'':'none'; document.getElementById('resetBtn').style.display=showAdd?'':'none';
  if(showFb){w.style.display='none';f.style.display='';renderFb();return;}
  f.style.display='none';w.style.display='';w.innerHTML='';
  if(view==='kanban')renderKanban(w);
  else if(view==='list')renderList(w);
  else renderCal(w);
}

const root=document.documentElement;
document.getElementById('themeBtn').onclick=()=>{
  const cur=root.getAttribute('data-theme');
  const next=cur==='dark'?'light':(cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark'));
  root.setAttribute('data-theme',next);render();
};
render();
</script>
