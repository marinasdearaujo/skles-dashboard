<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKLES Month Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Merriweather:wght@700&display=swap">
<style>
/* One page that turns the read and the team's answers into next month. Evidence on top,
   the plan below it, in the order the deck shows it. Light only, like the team read. */
:root{
  --bg:#F6F4EE; --surface:#FFFDF8; --line:#E2DED3; --wash:#ECEAE3;
  --ink:#2B3247; --muted:#6B7287; --navy:#112250; --gold:#E0C58F; --gold-ink:#8C6D2E;
  --good:#1E7A55; --good-bg:#DDEFE6; --bad:#B23A4E; --bad-bg:#F7E1E5; --warn:#8A5506; --warn-bg:#F6E8CF;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Merriweather',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--navy)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding-block:24px 96px;display:grid;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold-ink)}
.muted{color:var(--muted)} .small{font-size:13px}
header{display:grid;gap:8px}
header h1{font-family:var(--serif);font-size:26px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
.card h2{font-family:var(--serif);font-size:19px}
.num{font-family:var(--serif);font-size:13px;color:var(--gold-ink);margin-right:6px}
label{font-size:13px;font-weight:600;color:var(--navy);display:grid;gap:6px;min-width:0}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
input[readonly],textarea[readonly],select[disabled]{background:var(--wash);border-color:var(--wash)}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:99px}
.p-draft{background:var(--warn-bg);color:var(--warn)} .p-final{background:var(--good-bg);color:var(--good)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--navy);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn:focus-visible,.use:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.ev{display:grid;gap:0}
.ev div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ev div:first-child{border-top:0;padding-top:0}
.ev p{font-size:13.5px}
.ev b{color:var(--navy)}
.use{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.fc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fc div{background:var(--wash);border-radius:12px;padding:12px;display:grid;gap:2px}
.fc b{font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.fc span{font-size:12px;color:var(--muted)}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.state{font-size:12.5px;color:var(--muted)}
.err{display:none;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13.5px}
.exp{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.exp:first-of-type{border-top:0}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading the plan…</p></div>
<script>
const FB='https://rifa-mae-default-rtdb.firebaseio.com/skles-ops';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let M,S,REV,U={},CARDS={},PREV,P,ME=null,timer=null;

const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(0,4);
const next=m=>{let y=+m.slice(0,4),n=+m.slice(5)+1;if(n>12){n=1;y++;}return y+'-'+String(n).padStart(2,'0');};
const prev=m=>{let y=+m.slice(0,4),n=+m.slice(5)-1;if(n<1){n=12;y--;}return y+'-'+String(n).padStart(2,'0');};
const nameOf=k=>(U[k]&&U[k].name)||k.charAt(0).toUpperCase()+k.slice(1);
const slug=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'');
async function get(p){const r=await fetch(FB+'/'+p+'.json');if(!r.ok)throw 0;return r.json();}

function defaults(){
  const paid=(((REV.fronts||{}).paid||{}).data)||{},nm=next(M),mix={};
  Object.values(CARDS).forEach(c=>{if(c&&c.board==='social'&&(c.date||'').startsWith(nm)&&c.pillar&&c.status!=='Archive')mix[c.pillar]=(mix[c.pillar]||0)+1;});
  const accepted=Object.values(((S.responses||{}).propose)||{}).filter(x=>x&&x.accepted);
  const org=accepted.find(x=>x.front==='Organic');
  const d=new Date(+nm.slice(0,4),+nm.slice(5)-1,8);
  return {state:'draft',
    graded:((PREV&&PREV.plan&&PREV.plan.priorities)||[]).filter(p=>p.text).map(p=>({text:p.text,owner:p.owner,outcome:''})),
    learned:['','',''],
    paid:{budget:paid.spend?Math.round(paid.spend):'',cpl:paid.cpl||'',scale:'',test:''},
    organic:{mix:mix,test:org?org.change+' (works if '+(org.criterion||'…')+')':''},
    funnel:{target:30,change:''},
    priorities:[{text:'',owner:'marina',by:'',impact:''},{text:'',owner:'marina',by:'',impact:''},{text:'',owner:'valerie',by:'',impact:''}],
    decision:{question:'',dflt:'',by:d.toISOString().slice(0,10)}};
}

/* ------------------------------------------------------------ evidence */
function evidence(){
  const items=S.items||[],resp=S.responses||{},out=[];
  items.forEach(it=>{
    const by=resp[it.id]||{};
    if(it.kind==='rule'){
      const v={agree:0,disagree:0,unsure:0};Object.values(by).forEach(x=>x&&x.vote&&v[x.vote]++);
      out.push(['Rule · '+it.front,it.action+' '+it.text+' Team: '+v.agree+' agree, '+v.disagree+' disagree.'
        +Object.keys(by).filter(k=>by[k].text).map(k=>' '+nameOf(k)+': '+by[k].text).join(''),it.action]);
    }
    if(it.kind==='outlier'){
      Object.keys(by).forEach(k=>{const x=by[k];const t=[(x.chips||[]).join(', ').toLowerCase(),x.text].filter(Boolean).join('. ');
        if(t)out.push([(it.side==='top'?'Reached furthest':'Reached least')+' · '+nameOf(k),'“'+(it.post.caption||'').slice(0,60)+'”: '+t,x.text||t]);});
    }
    if(it.kind==='pair'){
      const n=Object.keys(by).length,r=Object.values(by).filter(x=>x.pick===it.winner).length,w=it[it.winner];
      if(n)out.push(['Match-up',(it.variable==='ad'?w.concept+' won on cost per lead':'The '+(w.pillar||w.format)+' post won on reach')
        +'. '+r+' of '+n+' called it.',(it.variable==='ad'?w.concept+' brings cheaper leads':(w.pillar||w.format)+' outreached the alternative')]);
    }
    if(it.kind==='objections'){
      const o=by.rodney||{};['o1','o2','o3'].forEach(k=>o[k]&&out.push(['Call queue objection',o[k],'Leads object: '+o[k]]));
      if(o.talked)out.push(['Call queue','Spoke to '+o.talked+' leads this month.','']);
    }
    if(it.kind==='grade'){
      Object.keys(by).forEach(k=>out.push(['Last month’s test · '+nameOf(k),it.change+': '+({hit:'hit',missed:'missed',notrun:'never ran'}[by[k].vote])+(by[k].text?'. '+by[k].text:''),it.change+' '+({hit:'hit',missed:'missed',notrun:'never ran'}[by[k].vote])]));
    }
  });
  return out;
}

/* ------------------------------------------------------------ render */
function f(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],P);}
function inp(path,attrs){const v=f(path);return '<input data-p="'+path+'" value="'+esc(v==null?'':v)+'"'+(attrs||'')+(ME!==S.lead?' readonly':'')+'>';}
function area(path,ph){return '<textarea data-p="'+path+'" placeholder="'+esc(ph||'')+'"'+(ME!==S.lead?' readonly':'')+'>'+esc(f(path)||'')+'</textarea>';}
function sel(path,opts){const v=f(path);return '<select data-p="'+path+'"'+(ME!==S.lead?' disabled':'')+'>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';}
function forecast(){
  const b=+f('paid.budget')||0,c=+f('paid.cpl')||0,t=+f('funnel.target')||0;
  const leads=c?Math.round(b/c):0,calls=Math.round(leads*t/100);
  return '<div class="fc"><div><b>'+leads+'</b><span>leads, at $'+(c||0)+' each</span></div><div><b>'+calls+'</b><span>reach a call, at '+t+'%</span></div>'
    +'<div><b>$'+(b||0).toLocaleString('en-US')+'</b><span>ad budget</span></div></div>';
}
function render(){
  if(!S){$('app').innerHTML='<div class="card"><h2>No month to plan yet</h2><p class="muted">The plan opens with the team read on the 26th.</p></div>';return;}
  if(!ME) return login();
  const lead=ME===S.lead,team=(S.team||[]).map(k=>[k,nameOf(k)]),ev=evidence();
  const accepted=Object.keys(((S.responses||{}).propose)||{}).map(k=>Object.assign({who:k},S.responses.propose[k])).filter(x=>x.accepted);
  const sent=(S.responses||{}),answered=(S.team||[]).filter(k=>Object.values(sent).some(by=>by&&by[k])).map(nameOf);
  $('app').innerHTML=
   '<header><div class="row"><span class="eyebrow">SKLES · plan for '+esc(nice(next(M)))+', from the '+esc(nice(M))+' read</span>'
   +'<span class="pill '+(P.state==='final'?'p-final':'p-draft')+'">'+(P.state==='final'?'Final':'Draft')+'</span></div>'
   +'<h1>What we decide, and why</h1><p class="small muted">Due by 07:00 on the 29th, when the deck builds. The email to Sean drafts itself from this on the 1st. '
   +(lead?'Everything saves as you type.':'Only Marina edits this page.')+'</p>'
   +'<p class="small muted">Team read: '+(answered.length?esc(answered.join(', '))+' answered.':'nobody has answered yet.')+' <a href="team-read.html?m='+M+'">Open it</a></p></header>'
   +'<div class="err" id="err">Could not save. Check the connection; your last change is still on screen.</div>'

   +'<div class="card"><h2>The evidence</h2><p class="small muted">From the read and the team. “Use” copies a line into what we learned.</p><div class="ev">'
   +(ev.length?ev.map((e,i)=>'<div><p><b>'+esc(e[0])+'</b><br>'+esc(e[1])+'</p>'+(lead&&e[2]?'<button class="use" data-use="'+i+'">Use</button>':'<span></span>')+'</div>').join('')
     :'<p class="small muted">No answers yet. The read closes on the 28th at 09:00.</p>')+'</div></div>'

   +(P.graded&&P.graded.length?'<div class="card"><h2><span class="num">1</span>Last month’s priorities, graded</h2>'
     +P.graded.map((g,i)=>'<div class="g3"><label>Priority<input value="'+esc(g.text)+'" readonly></label><label>Owner<input value="'+esc(nameOf(g.owner||''))+'" readonly></label><label>Result'
       +sel('graded.'+i+'.outcome',[['','Pick one'],['worked','Worked'],['failed','Failed'],['inconclusive','Inconclusive']])+'</label></div>').join('')+'</div>':'')

   +'<div class="card"><h2><span class="num">2</span>What we learned</h2><p class="small muted">Three lines at most. Each one should cite a number or a team note.</p>'
   +[0,1,2].map(i=>area('learned.'+i,i?'':'Example: student-win feed posts reached 145 per post against 103 for Reels, across 41 posts')).join('')+'</div>'

   +'<div class="card"><h2><span class="num">3</span>Paid</h2><div class="g2"><label>Ad budget for the month ($)'+inp('paid.budget',' inputmode="decimal"')+'</label>'
   +'<label>Expected cost per lead ($)'+inp('paid.cpl',' inputmode="decimal"')+'</label></div>'
   +'<label>Concepts we scale'+inp('paid.scale')+'</label><label>Concepts we test (3 or 4 hooks each)'+inp('paid.test')+'</label></div>'

   +'<div class="card"><h2><span class="num">4</span>Organic</h2><p class="small muted">Posts planned by pillar, read from the ops board cards dated in '+esc(nice(next(M)))+'.</p><div class="mix">'
   +(Object.keys(P.organic.mix||{}).length?Object.keys(P.organic.mix).map(k=>'<label>'+esc(k)+inp('organic.mix.'+k,' inputmode="numeric"')+'</label>').join(''):'<p class="small muted">No cards dated next month yet.</p>')+'</div>'
   +'<label>The one deliberate test'+inp('organic.test')+'</label></div>'

   +'<div class="card"><h2><span class="num">5</span>Funnel</h2><div class="g2"><label>Leads reaching a call, target (%)'+inp('funnel.target',' inputmode="numeric"')+'</label>'
   +'<label>The change to follow-up'+inp('funnel.change')+'</label></div></div>'

   +'<div class="card"><h2><span class="num">6</span>Experiments</h2><p class="small muted">Accepted on the team read, each with its criterion written before it runs.</p>'
   +(accepted.length?accepted.map(x=>'<div class="exp"><p><b>'+esc(x.front)+'</b> · '+esc(x.change)+'</p><p class="small muted">'+esc(x.metric)+'. Works if '+esc(x.criterion||'not written')+'. Run by '+esc(nameOf(x.owner||x.who))+'.</p></div>').join('')
     :'<p class="small muted">None accepted yet. Accept proposals on the team read.</p>')+'</div>'

   +'<div class="card"><h2><span class="num">7</span>Forecast</h2><div id="fc">'+forecast()+'</div><p class="small muted">Leads are the budget divided by expected cost per lead; calls are leads times the target. Organic is not forecast until monthly volume supports it.</p></div>'

   +'<div class="card"><h2><span class="num">8</span>Three priorities</h2><p class="small muted">These become the priorities slide in Sean’s report and the changes table for the team.</p>'
   +[0,1,2].map(i=>'<div class="g3"><label>Priority '+(i+1)+inp('priorities.'+i+'.text')+'</label><label>Owner'+sel('priorities.'+i+'.owner',team)+'</label><label>By'+inp('priorities.'+i+'.by',' type="date"')+'</label></div>'
     +'<label>Expected impact'+inp('priorities.'+i+'.impact',' placeholder="1 sale ≈ $1,999"')+'</label>').join('')+'</div>'

   +'<div class="card"><h2><span class="num">9</span>The one decision only Sean can make</h2>'
   +'<label>The question'+inp('decision.question',' placeholder="Two 15-minute call slots a week for leads who book"')+'</label>'
   +'<label>What we do if he does not answer'+inp('decision.dflt',' placeholder="We open the slots on your calendar from the 12th"')+'</label>'
   +'<label>Answer needed by'+inp('decision.by',' type="date"')+'</label></div>'

   +(lead?'<div class="row"><span class="state" id="st">'+(P.updated?'Saved '+new Date(P.updated).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit'}):'Not saved yet')+'</span>'
     +'<button class="btn" id="fin">'+(P.state==='final'?'Reopen as draft':'Mark final')+'</button></div>':'');
  wire();
}
function set(path,v){const ks=path.split('.');let o=P;ks.slice(0,-1).forEach(k=>{if(o[k]==null)o[k]={};o=o[k];});o[ks[ks.length-1]]=v;}
async function save(){
  P.updated=new Date().toISOString();P.by=ME;
  try{const r=await fetch(FB+'/session/'+M+'/plan.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(P)});
    if(!r.ok)throw 0;$('err').style.display='none';if($('st'))$('st').textContent='Saved just now';}
  catch(e){$('err').style.display='block';}
}
function wire(){
  if(ME!==S.lead)return;
  document.querySelectorAll('[data-p]').forEach(el=>{
    el.oninput=el.onchange=()=>{const num=/budget|cpl|target|mix\./.test(el.dataset.p);set(el.dataset.p,num&&el.value!==''?+el.value:el.value);
      if($('fc'))$('fc').innerHTML=forecast();if($('st'))$('st').textContent='Saving…';clearTimeout(timer);timer=setTimeout(save,900);};
  });
  const ev=evidence();
  document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{
    const i=P.learned.findIndex(x=>!x);if(i<0)return;P.learned[i]=ev[+b.dataset.use][2];save();render();});
  $('fin').onclick=async()=>{P.state=P.state==='final'?'draft':'final';await save();render();};
}
function login(){
  const names=(S.team||[]).concat(S.viewers||[]);
  $('app').innerHTML='<header><span class="eyebrow">SKLES · month plan</span><h1>Sign in</h1><p class="small muted">Same name and PIN as the ops board.</p></header>'
    +'<div class="card"><label>Your name<select id="ln">'+names.map(k=>'<option value="'+k+'">'+esc(nameOf(k))+'</option>').join('')+'</select></label>'
    +'<label>PIN<input id="lp" type="password" inputmode="numeric"></label><div class="row"><span class="small" id="lm" style="color:var(--bad)"></span><button class="btn" id="lg">Sign in</button></div></div>';
  const go=()=>{const k=$('ln').value,u=U[k]||{};if(!u.pin||u.pin!==$('lp').value.trim()){$('lm').textContent=u.pin?'That PIN does not match.':'Set your PIN on the team read first.';return;}
    ME=k;try{localStorage.setItem('skles_ops_sess',nameOf(k))}catch(e){}render();};
  $('lg').onclick=go;$('lp').onkeydown=e=>{if(e.key==='Enter')go();};
}
(async function(){
  try{
    const all=await get('session')||{};U=await get('users')||{};
    const q=new URLSearchParams(location.search).get('m'),months=Object.keys(all).sort().reverse();
    M=q&&all[q]?q:months[0];S=M?all[M]:null;
    if(S){REV=await get('review/'+M)||{};CARDS=await get('cards')||{};PREV=all[prev(M)]||null;
      P=Object.assign(defaults(),S.plan||{});}
    let s=null;try{s=localStorage.getItem('skles_ops_sess')}catch(e){}
    if(S&&s){const k=slug(s);if(U[k]&&(S.team||[]).concat(S.viewers||[]).indexOf(k)>=0)ME=k;}
  }catch(e){}
  render();
})();
</script>
</body>
</html>
