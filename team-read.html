<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SKLES Team Read</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Merriweather:wght@700&display=swap">
<style>
/* One screen: the month in three lines, then each proposed point to agree with, change or
   drop. Opened from a personal link, so there is nothing to sign in to. Light only. */
:root{
  --bg:#F6F4EE; --surface:#FFFDF8; --line:#E2DED3; --wash:#ECEAE3;
  --ink:#2B3247; --muted:#6B7287; --navy:#112250; --gold:#E0C58F; --gold-ink:#8C6D2E;
  --good:#1E7A55; --good-bg:#DDEFE6; --bad:#B23A4E; --bad-bg:#F7E1E5; --warn:#8A5506; --warn-bg:#F6E8CF;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Merriweather',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--navy)}
p{margin:0}
button,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-block:22px 80px;display:grid;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold-ink)}
.muted{color:var(--muted)} .small{font-size:13px}
header{display:grid;gap:8px}
header h1{font-family:var(--serif);font-size:24px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:600;color:var(--navy)}
.who{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--wash);color:var(--muted)}
.chip.done{background:var(--good-bg);color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px}
.card.agree{border-color:var(--good)} .card.change{border-color:var(--warn)} .card.drop{border-color:var(--bad)}
.owner{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
.card h2{font-size:17px;line-height:1.4;font-weight:600;font-family:var(--sans)}
.why{font-size:13.5px;color:var(--muted)}
.impact{font-size:13px;font-weight:600;color:var(--good)}
.votes{display:flex;gap:8px;flex-wrap:wrap}
.vote{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:14px;cursor:pointer}
.vote[aria-pressed="true"][data-v="agree"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.vote[aria-pressed="true"][data-v="change"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.vote[aria-pressed="true"][data-v="drop"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.vote:focus-visible,.btn:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
textarea{width:100%;min-height:68px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);resize:vertical}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--navy);color:var(--surface)}
.saved{font-size:12.5px;color:var(--good)}
.other{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.other b{color:var(--navy)}
.err{display:none;background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13.5px}
.pick{display:grid;gap:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script>
const FB='https://rifa-mae-default-rtdb.firebaseio.com/skles-ops';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const VERB={agree:'agrees',change:'would change it',drop:'would drop it'};
let M,S,U={},ME=null;

const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=m=>MONTHS[+m.slice(5)-1]+' '+m.slice(0,4);
const nextName=m=>MONTHS[+m.slice(5)%12];
const nameOf=k=>(U[k]&&U[k].name)||k.charAt(0).toUpperCase()+k.slice(1);
const R=(id,who)=>((((S.responses||{})[id])||{})[who||ME]);
const open=()=>S.state==='open'&&new Date(S.closes)>new Date();
function keep(v){try{localStorage.setItem('skles_read_who',v)}catch(e){}}
function kept(){try{return localStorage.getItem('skles_read_who')}catch(e){return null}}

async function get(p){const r=await fetch(FB+'/'+p+'.json');if(!r.ok)throw 0;return r.json();}
async function put(p,v){
  try{const r=await fetch(FB+'/'+p+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
    if(!r.ok)throw 0;$('err').style.display='none';return true;}catch(e){$('err').style.display='block';return false;}
}
function done(k){return (S.points||[]).filter(p=>R(p.id,k)).length;}

function point(p){
  const r=R(p.id)||{},can=open(),v=r.vote;
  const others=Object.entries((S.responses||{})[p.id]||{}).filter(([k])=>k!==ME)
    .map(([k,x])=>'<p class="other"><b>'+esc(nameOf(k))+'</b> '+esc(VERB[x.vote]||'')+(x.text?': '+esc(x.text):'')+'</p>').join('');
  return '<div class="card '+(v||'')+'" data-id="'+esc(p.id)+'">'
    +'<span class="owner">'+esc(nameOf(p.owner))+'</span><h2>'+esc(p.text)+'</h2>'
    +'<p class="why">'+esc(p.why)+'</p>'+(p.impact?'<p class="impact">'+esc(p.impact)+'</p>':'')
    +(can?'<div class="votes">'+[['agree','Agree'],['change','Change it'],['drop','Drop it']]
      .map(o=>'<button class="vote" data-v="'+o[0]+'" aria-pressed="'+(v===o[0])+'">'+o[1]+'</button>').join('')+'</div>'
      +'<div class="note"'+(v==='change'||v==='drop'||r.text?'':' hidden')+'><textarea placeholder="'
      +(v==='drop'?'Why drop it?':'What would you do instead?')+'">'+esc(r.text||'')+'</textarea>'
      +'<div class="row"><span class="saved">'+(r.at?'Saved':'')+'</span><button class="btn">Save</button></div></div>'
      :'<p class="small">'+(v?'You '+esc({agree:'agreed',change:'asked to change it',drop:'asked to drop it'}[v])+(r.text?': '+esc(r.text):'.'):'You did not answer, so it stood.')+'</p>')
    +others+'</div>';
}

function render(){
  if(!S){$('app').innerHTML='<div class="card"><h2>Nothing to look at yet</h2><p class="muted">The next direction arrives on the 26th.</p></div>';return;}
  if(!ME){
    $('app').innerHTML='<header><span class="eyebrow">SKLES · '+esc(nice(M))+'</span><h1>Who is this?</h1></header><div class="card pick">'
      +(S.team||[]).map(k=>'<button class="btn" data-who="'+k+'">'+esc(nameOf(k))+'</button>').join('')+'</div>';
    document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{ME=b.dataset.who;keep(ME);render();});
    return;
  }
  const pts=S.points||[],n=done(ME),closes=new Date(S.closes);
  const missing=((S.responses||{}).missing||{})[ME]||{};
  $('app').innerHTML='<header><span class="eyebrow">SKLES · direction for '+esc(nextName(M))+', from '+esc(nice(M))+'</span>'
    +'<h1>'+(open()?'Hi '+esc(nameOf(ME))+'. Does this direction look right to you?':'What the team said')+'</h1>'
    +'<div class="facts">'+(S.summary_lines||[]).map(l=>'<span>'+esc(l)+'</span>').join('')+'</div>'
    +'<p class="small muted">'+(open()?'Tap Agree, Change it or Drop it on each point. Anything you skip stands as written. Open until '
      +closes.toLocaleString('en-US',{weekday:'long',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+'.'
      :'Closed. This is what went into the plan.')+'</p>'
    +'<div class="who">'+(S.team||[]).map(k=>'<span class="chip'+(done(k)>=pts.length?' done':'')+'">'+esc(nameOf(k))+' '
      +(done(k)>=pts.length?'done':done(k)+'/'+pts.length)+'</span>').join('')+'</div></header>'
    +'<div class="err" id="err">That did not save. Check your signal and tap again.</div>'
    +pts.map(point).join('')
    +'<div class="card" id="miss"><span class="owner">Anything missing?</span><h2>One thing the plan should include that it does not</h2>'
    +(open()?'<textarea placeholder="Optional">'+esc(missing.text||'')+'</textarea><div class="row"><span class="saved">'+(missing.at?'Saved':'')
      +'</span><button class="btn">Save</button></div>':'<p class="small">'+esc(missing.text||'Nothing added.')+'</p>')+'</div>'
    +(open()&&n>=pts.length?'<p class="small muted" style="text-align:center">That is everything. Thank you. The plan builds itself on the 28th.</p>':'');
  wire();
}

function wire(){
  document.querySelectorAll('.card[data-id]').forEach(card=>{
    const id=card.dataset.id,note=card.querySelector('.note'),ta=card.querySelector('textarea');
    const send=async(vote)=>{
      const v={vote:vote,text:ta?ta.value.trim():'',at:new Date().toISOString()};
      if(await put('session/'+M+'/responses/'+id+'/'+ME,v)){S.responses=S.responses||{};(S.responses[id]=S.responses[id]||{})[ME]=v;render();}
    };
    card.querySelectorAll('.vote').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v;
      if(v==='agree') return send('agree');
      card.querySelectorAll('.vote').forEach(x=>x.setAttribute('aria-pressed',x===b));
      card.className='card '+v;note.hidden=false;ta.placeholder=v==='drop'?'Why drop it?':'What would you do instead?';ta.focus();
      card.dataset.pending=v;
    });
    const btn=card.querySelector('.note .btn');
    if(btn) btn.onclick=()=>{
      const v=card.dataset.pending||(R(id)||{}).vote||'agree';
      if((v==='change'||v==='drop')&&!ta.value.trim()){ta.focus();return;}
      send(v);
    };
  });
  const m=$('miss'),mb=m&&m.querySelector('.btn');
  if(mb) mb.onclick=async()=>{const t=m.querySelector('textarea').value.trim();
    const v={text:t,at:new Date().toISOString()};
    if(await put('session/'+M+'/responses/missing/'+ME,v)){(S.responses=S.responses||{}).missing=Object.assign({},S.responses.missing,{[ME]:v});render();}};
}

(async function(){
  try{
    const q=new URLSearchParams(location.search),all=await get('session')||{};U=await get('users')||{};
    const months=Object.keys(all).filter(m=>all[m]&&all[m].kind==='direction').sort().reverse();
    M=q.get('m')&&all[q.get('m')]?q.get('m'):(months.find(m=>all[m].state==='open')||months[0]);
    S=M?all[M]:null;
    const w=q.get('who')||kept();
    if(S&&w&&(S.team||[]).indexOf(w)>=0){ME=w;keep(w);}
  }catch(e){}
  render();
})();
</script>
</body>
</html>
