<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly Review Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --line:#e6eaf3; --grid:#dfe4ef; --wash:#eef1f8;
  --navy:#1b2b58; --gold:#c79a3f; --ink:#171b26; --muted:#6b7490;
  --good:#17805a; --bad:#c13b52;
  --lift:0 1px 2px rgba(23,35,70,.06),0 8px 22px rgba(23,35,70,.07);
  --lift-sm:0 1px 2px rgba(23,35,70,.05),0 5px 14px rgba(23,35,70,.05);
  --deep:linear-gradient(140deg,#24376d,#16224a);
  --sans:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Merriweather',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
  overflow:hidden}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--navy)}
img{display:block;max-width:100%}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold)}
select,input,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:0;border-radius:11px;padding:9px 13px;box-shadow:var(--lift-sm)}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.55}
#err{display:none;background:#fdeef1;color:var(--bad);border-radius:12px;padding:10px 13px;
  font-size:12.5px;box-shadow:var(--lift-sm);margin-bottom:14px}

/* shell */
.app{height:100%;max-width:1420px;margin:0 auto;padding:0 18px;
  display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:18px 14px}
.bar h1{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.03em;white-space:nowrap}
.bar .sub{font-size:11.5px;color:var(--muted);flex:1}
.panes{display:grid;grid-template-columns:304px minmax(0,1fr);gap:16px;min-height:0;
  padding-bottom:18px}

/* left list */
.list{overflow-y:auto;min-height:0;display:grid;gap:7px;align-content:start;
  padding:2px 5px 20px 2px}
.lh{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:var(--muted);padding:11px 4px 1px}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:3px 11px;align-items:center;
  text-align:left;font-family:inherit;border:0;cursor:pointer;border-radius:14px;
  box-shadow:var(--lift-sm);padding:12px 14px;transition:.14s;color:inherit;
  background:var(--card)}
.it:hover{box-shadow:var(--lift);transform:translateY(-1px)}
.it .pic{width:36px;height:36px;border-radius:10px;object-fit:cover;grid-row:span 2;
  background:var(--wash)}
.it .dot{width:7px;height:7px;border-radius:50%;background:var(--grid);grid-row:span 2}
.it .nm{font-size:13.5px;font-weight:600;color:var(--navy);min-width:0}
.it .fig{font-size:14.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
.it .sb{font-size:10.5px;color:var(--muted);line-height:1.3;grid-column:2/-1}
.it[aria-current=true]{background:var(--deep);box-shadow:0 8px 24px rgba(23,35,70,.22)}
.it[aria-current=true] .nm{color:#fff}
.it[aria-current=true] .fig{color:var(--gold)}
.it[aria-current=true] .sb{color:#b6c0da}
.it[aria-current=true] .dot.good{background:#6fe0ad}
.it[aria-current=true] .dot.bad{background:#ff9fb0}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)}
.kbd{font-size:11px;color:var(--muted);padding:9px 6px 0}
.kbd b{font-family:ui-monospace,monospace;background:var(--card);border-radius:5px;padding:1px 6px;
  font-weight:400;box-shadow:var(--lift-sm)}

/* right pane */
.detail{overflow-y:auto;min-height:0;padding:2px 4px 30px 2px}
.dwrap{max-width:1000px}
.hd{margin-bottom:18px}
.hd h2{font-size:clamp(22px,3vw,29px);font-weight:700;color:var(--navy);letter-spacing:-.03em}
.hd p{font-family:var(--serif);font-size:14.5px;line-height:1.6;color:var(--muted);
  margin-top:8px;max-width:68ch}
.hd p b{color:var(--navy)}
.card{border-radius:18px;box-shadow:var(--lift);padding:21px 23px;background:var(--card)}
.card+.card{margin-top:13px}
.fh{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.fh h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;flex:1}
.hero{display:flex;align-items:flex-end;gap:13px;padding-bottom:15px;margin-bottom:4px;
  border-bottom:1px solid rgba(23,35,70,.08)}
.hero b{font-size:42px;font-weight:700;line-height:.95;color:var(--navy);letter-spacing:-.035em;
  font-variant-numeric:tabular-nums}
.hero b.good{color:var(--good)} .hero b.bad{color:var(--bad)}
.hero span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--muted);padding-bottom:6px}
.mcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:0 30px}
.mrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;
  border-bottom:1px solid rgba(23,35,70,.06);font-size:13.5px}
.mrow span{color:var(--muted)}
.mrow b{font-weight:600;font-variant-numeric:tabular-nums}
.mrow b.good{color:var(--good)} .mrow b.bad{color:var(--bad)}
.verdict{font-size:13.5px;line-height:1.6;margin-top:17px;background:var(--wash);
  border-radius:13px;padding:13px 15px;color:var(--ink)}
.verdict:before{content:'';display:block;width:26px;height:3px;border-radius:3px;
  background:var(--gold);margin-bottom:9px}

/* direction */
.more{margin-top:14px}
.more summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);list-style:none;padding:6px 0}
.more summary::-webkit-details-marker{display:none}
.more summary:before{content:'+ '}
.more[open] summary:before{content:'− '}
.dp{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:start}
.dpn{width:30px;height:30px;border-radius:50%;background:var(--deep);color:#fff;font-weight:700;
  font-size:13px;display:grid;place-items:center}
.own{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.dp h3,.ask h3{font-size:16.5px;font-weight:600;color:var(--navy);line-height:1.4;margin-top:4px}
.dp .ev{font-size:13px;color:var(--muted);margin-top:6px}
.dp .imp{font-size:12.5px;font-weight:600;color:var(--good);margin-top:6px}
.ask{background:linear-gradient(140deg,#e9d3a1,#e0c58f)}
.ask .own{color:var(--navy)}
.said{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.said p{font-size:13px;color:var(--muted)} .said b{color:var(--navy)}
.go{font-family:inherit;border:0;border-radius:11px;padding:9px 14px;font-weight:600;font-size:13px;
  background:var(--deep);color:#fff;cursor:pointer}

/* figures + trend */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px}
.fig{background:var(--card);border-radius:16px;box-shadow:var(--lift-sm);padding:14px 16px}
.fig b{display:block;font-size:25px;font-weight:700;color:var(--navy);letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.05}
.fig b.good{color:var(--good)} .fig b.bad{color:var(--bad)}
.fig span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;display:block;margin-top:6px}
.fig em{font-style:normal;display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.bars{display:grid;gap:14px}
.brow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:center}
.brow .bm{font-size:13px;font-weight:600;color:var(--navy)}
.brow .bt{height:24px;background:var(--wash);border-radius:7px;overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:7px;background:var(--deep)}
.brow .bt i.now{background:linear-gradient(90deg,#c79a3f,#e0c58f)}
.brow .bv{font-size:14px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right}
.brow .bv small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.axis{font-size:11px;color:var(--muted);margin-top:15px;padding-top:12px;
  border-top:1px solid var(--line)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:13px}
.post{background:var(--card);border-radius:17px;box-shadow:var(--lift);overflow:hidden;
  text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:.16s}
.post:hover{box-shadow:0 3px 6px rgba(23,35,70,.08),0 16px 34px rgba(23,35,70,.14);
  transform:translateY(-2px)}
.post .shot{position:relative;aspect-ratio:4/5;background:var(--wash);overflow:hidden}
.post .shot img{width:100%;height:100%;object-fit:cover}
.post .shot .none{display:flex;align-items:center;justify-content:center;height:100%;
  font-size:11px;color:var(--muted);text-align:center;padding:14px}
.post .rk{position:absolute;top:9px;left:9px;background:rgba(27,43,88,.9);color:#fff;
  font-size:10px;font-weight:700;letter-spacing:.05em;padding:4px 9px;border-radius:30px}
.post .rk.top{background:linear-gradient(135deg,#c79a3f,#e0c58f);color:#1b2b58}
.post .re{position:absolute;bottom:9px;right:9px;background:rgba(255,255,255,.94);
  border-radius:11px;padding:5px 10px;text-align:right}
.post .re b{display:block;font-size:16px;font-weight:700;color:var(--navy);line-height:1;
  font-variant-numeric:tabular-nums}
.post .re span{font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:700}
.post .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.post .first{font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tg{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
  background:var(--wash);color:var(--muted);border-radius:20px;padding:3px 8px;white-space:nowrap}
.tg.p{background:#eef2fd;color:#2c4484}
.tg.f{background:#eefaf4;color:#17805a}
.tg.u{background:#fdf6e7;color:#8a6a1e}
.post .nums{display:flex;gap:12px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.post .nums div{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  font-weight:700}
.post .nums b{display:block;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;
  letter-spacing:0;text-transform:none}

/* youtube */
.yt{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.vid{background:var(--card);border-radius:16px;box-shadow:var(--lift-sm);overflow:hidden;
  text-decoration:none;color:inherit;transition:.16s}
.vid:hover{box-shadow:var(--lift);transform:translateY(-2px)}
.vid .shot{aspect-ratio:16/9;background:var(--wash);position:relative}
.vid .shot img{width:100%;height:100%;object-fit:cover}
.vid .v{position:absolute;bottom:8px;right:8px;background:rgba(27,43,88,.92);color:#fff;
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px}
.vid .t{padding:11px 13px;font-size:12px;font-weight:500;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* readout */
.dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dh h3{font-size:16px;font-weight:700;color:var(--navy)}
.dh .sp{font-size:11.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.dh .src{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  background:var(--wash);color:var(--muted);border-radius:20px;padding:3px 9px;margin-left:auto}
.dh .src.board{background:#fdf6e7;color:#8a6a1e}
.drow{display:grid;grid-template-columns:138px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:4px 0}
.drow .dv{font-size:12.5px}
.drow .dv small{color:var(--muted)}
.drow .dt{height:16px;background:var(--wash);border-radius:6px;overflow:hidden}
.drow .dt i{display:block;height:100%;border-radius:6px;background:#9fb0d8}
.drow.best .dt i{background:var(--deep)}
.drow.worst .dt i{background:#e4b9c2}
.drow .da{font-size:13px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}

/* projection + directions + boxes */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  padding:0 12px 9px 0;border-bottom:1px solid var(--grid)}
th.r,td.r{text-align:right}
td{padding:9px 12px 9px 0;border-bottom:1px solid rgba(23,35,70,.06);
  font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;color:var(--navy);border-top:2px solid var(--navy);border-bottom:0}
td .est{font-size:10px;color:var(--muted)}
.d{background:var(--deep);color:#fff;border-radius:17px;padding:17px 19px;box-shadow:var(--lift)}
.d+.d{margin-top:10px}
.d h3{font-size:14.5px;color:#fff}
.d h3 em{font-style:normal;color:var(--gold);font-weight:400;font-size:11.5px}
.d p{font-size:13.5px;color:#d6dcee;margin-top:5px;max-width:70ch}
.rl{background:var(--card);border-radius:14px;box-shadow:var(--lift-sm);padding:13px 15px}
.rl+.rl{margin-top:8px}
.rl .rule{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--gold)}
.rl p{font-size:13.5px;margin-top:4px}
.box{background:var(--card);border-radius:16px;box-shadow:var(--lift-sm);padding:16px 18px}
.box+.box{margin-top:10px}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.bh h3{font-size:14.5px;color:var(--navy)}
.bh .role{font-size:11.5px;color:var(--muted);flex:1}
.state{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--muted);background:var(--wash);border-radius:20px;padding:2px 9px}
.state.in{background:#e3f4ec;color:var(--good)}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px}
.plan a{font-size:16px;font-weight:700}
.url{width:100%;max-width:430px;margin-top:11px}


/* contact sheet: the ranked table whose first column is the picture */
.who{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;
  box-shadow:var(--lift-sm);padding:11px 15px;margin-bottom:13px;flex-wrap:wrap}
.who span{font-size:12.5px;color:var(--muted)}
.who b{font-size:12.5px;color:var(--navy)}
.sheet{background:var(--card);border-radius:18px;box-shadow:var(--lift);overflow-x:auto;
  padding:4px 8px 8px}
table.cs{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
table.cs th{text-align:left;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:14px 10px 10px;white-space:nowrap;cursor:pointer;
  border-bottom:1px solid var(--grid);user-select:none}
table.cs th:hover{color:var(--navy)}
table.cs th.on{color:var(--navy)}
table.cs th .ar{font-size:8px;margin-left:3px}
table.cs th.r,table.cs td.r{text-align:right}
table.cs td{padding:9px 10px;border-bottom:1px solid rgba(23,35,70,.06);vertical-align:middle}
table.cs tr:last-child td{border-bottom:0}
table.cs tr:hover td{background:var(--wash)}
table.cs td.n{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
table.cs td.rank{font-size:11px;color:var(--muted);font-weight:700;width:26px}
.csimg{width:52px;height:65px;border-radius:7px;object-fit:cover;background:var(--wash);
  display:block}
.csimg.none{display:flex;align-items:center;justify-content:center;font-size:8px;
  color:var(--muted);text-align:center}
.cscap{min-width:190px;max-width:300px}
.cscap a{font-size:12.5px;line-height:1.4;color:var(--ink);text-decoration:none;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cscap a:hover{color:var(--navy)}
.cscap small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.ch{font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
  background:var(--wash);color:var(--muted);border-radius:20px;padding:3px 8px;
  white-space:nowrap;display:inline-block}
.ch.p{background:#eef2fd;color:#2c4484}
.ch.f{background:#eefaf4;color:#17805a}
.ch.u{background:#fdf6e7;color:#8a6a1e}
.nb{font-family:inherit;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  font-weight:700;border:0;border-radius:20px;padding:5px 11px;cursor:pointer;
  background:var(--wash);color:var(--muted);white-space:nowrap}
.nb:hover{background:var(--navy);color:#fff}
.nb.has{background:#e3f4ec;color:var(--good)}
.nrow td{background:var(--wash)}
.nbox{display:flex;gap:9px;align-items:flex-start;padding:4px 0}
.nbox textarea{min-height:58px;font-size:13px}
.nbox .nsave{font-family:inherit;font-size:11.5px;font-weight:600;border:0;border-radius:11px;
  padding:9px 16px;cursor:pointer;background:var(--deep);color:#fff;white-space:nowrap}
.note{font-size:12px;line-height:1.5;color:var(--ink);background:#e9f3ee;border-radius:10px;
  padding:9px 12px;margin-top:5px}
.note b{color:var(--good)}
.csfoot{font-size:11.5px;color:var(--muted);margin-top:13px;line-height:1.55}

/* The per-channel tint. These sit LAST on purpose: .it and .card set their own background,
   and at equal specificity the later rule is the one that paints. */
.t-paid{background:linear-gradient(180deg,#eefaf4,#fff 46%)}
.t-social{background:linear-gradient(180deg,#fdf6e7,#fff 46%)}
.t-uploads{background:linear-gradient(180deg,#f1f3f8,#fff 46%)}
.t-youtube{background:linear-gradient(180deg,#fdeef2,#fff 46%)}
.t-funnel{background:linear-gradient(180deg,#eef2fd,#fff 46%)}
.t-month{background:linear-gradient(180deg,#f3eefd,#fff 46%)}
.t-ran{background:linear-gradient(180deg,#eefaf4,#fff 46%)}
.t-why{background:linear-gradient(180deg,#fdf6e7,#fff 46%)}
.t-next{background:linear-gradient(180deg,#eef2fd,#fff 46%)}
.it[aria-current=true]{background:var(--deep)}

@media(max-width:860px){
  html,body{height:auto}body{overflow:auto}
  .app{display:block}.panes{grid-template-columns:1fr}
  .list,.detail{overflow:visible}.kbd{display:none}
  .gal{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .brow{grid-template-columns:66px minmax(0,1fr) auto;gap:9px}
  .drow{grid-template-columns:100px minmax(0,1fr) auto;gap:9px}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div><div class="eyebrow">Skills&nbsp;Up &middot; Sean K. Langston</div>
      <h1 id="title">Monthly review</h1></div>
    <span class="sub" id="built"></span>
    <select id="pick" aria-label="Which month"></select>
  </div>
  <div class="panes">
    <nav class="list" id="list" aria-label="Sections"></nav>
    <div class="detail"><div class="dwrap">
      <div id="err">Cannot reach the sheet just now. Nothing typed will save until the
        connection is back.</div>
      <div id="detail"></div>
    </div></div>
  </div>
</div>

<script>
const FB='https://rifa-mae-default-rtdb.firebaseio.com/skles-ops/review';
const MONTHS=['January','February','March','April','May','June','July','August',
  'September','October','November','December'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CPLB=18.5;
let ALL={},CUR=null,SEL=null;

const fail=()=>{const e=document.getElementById('err');if(e)e.style.display='block';};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=m=>{const p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0];};
const shortm=m=>{const p=m.split('-');return MONTHS[+p[1]-1].slice(0,3)+' '+p[0].slice(2);};
const num=v=>(v==null?'—':Number(v).toLocaleString('en-GB'));
const money=v=>(v==null?'—':'$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
const wd=d=>{const n=new Date(d+'T12:00:00').getDay();return DAYS[n===0?6:n-1];};

const SAYS=[['marissa','Marissa','YouTube, and what is already recorded',
   'What you would change, what is worth repeating, and what is recorded and waiting.'],
  ['valerie','Valerie','social, and what travelled',
   'Which posts worked, which did not, and anything the cards got wrong.'],
  ['marina','Marina','anything the rules missed','Notes that belong with this month’s record.']];

/* ---------------------------------------------------------------- the model */
/* Each verdict compares: this month against last month and the benchmark, so the sentence
   changes when the numbers do. A sentence that reads the same every month gets skipped. */
const mon=m=>MONTHS[+m.slice(5)-1];
const pmKey=m=>{let y=+m.slice(0,4),n=+m.slice(5)-1;if(n<1){n=12;y--;}return y+'-'+String(n).padStart(2,'0');};
const pct=(a,b)=>(a==null||!b)?null:Math.round((a-b)/b*100);
const way=(a,b)=>{const p=pct(a,b);return p==null?'':p>0?'up '+p+'%':p<0?'down '+(-p)+'%':'flat';};
const running=m=>m===new Date().toISOString().slice(0,7);
const OWNER={rodney:'Rodney',marina:'Marina',valerie:'Valerie',marissa:'Marissa'};

function model(d){
  d=d||{};
  const f=d.fronts||{},c=d.content||{};
  const pm=pmKey(CUR),pd=ALL[pm]||{},pf=pd.fronts||{};
  const pp=(pf.paid&&pf.paid.data)||null,pfn=(pf.funnel&&pf.funnel.data)||{};
  const paid=(f.paid&&f.paid.data)||null;
  const soc=(f.social&&f.social.data)||{},ig=soc.ig,fb=soc.fb,bd=soc.board||{},st=bd.by_status||{};
  const up=(f.uploads&&f.uploads.data)||{},fbp=up['facebook-sean']||{},
        li=up.linkedin||{},tk=up.tiktok||{},tot=fbp.totals||{};
  const yt=(f.youtube&&f.youtube.data)||{};
  const fn=(f.funnel&&f.funnel.data)||{},lc=fn.lifecycle||{};
  const posts=c.posts||[],vids=c.youtube||[],ms=c.months||[];
  const me=ms.filter(x=>x.m===CUR)[0]||{posts:0,reach:0,avg:0,acts:0};
  const prev=ms[ms.findIndex(x=>x.m===CUR)+1]||null;
  const F=[];

  F.push({key:'paid',label:'Paid',note:'Meta ads, pulled every three hours',
    head:paid&&paid.cpl?money(paid.cpl):'—',headsub:'cost per lead',
    tone:paid&&paid.cpl&&paid.cpl<CPLB?'good':'bad',
    metrics:paid?[['Spend',money(paid.spend)],['Leads',num(paid.leads)],
      ['Per lead',money(paid.cpl),paid.cpl<CPLB?'good':'bad'],
      ['Impressions',num(paid.impressions)],['People reached',num(paid.reach)],
      ['Frequency',paid.frequency?paid.frequency+'×':'—'],
      ['Clicks',num(paid.clicks)+(paid.ctr?' · '+paid.ctr+'%':'')],
      ['Link clicks',num(paid.link_clicks)],['Video views',num(paid.video_views)],
      ['CPM',money(paid.cpm)],['Comments on ads',num(paid.comments),paid.comments?'bad':null]]:[],
    verdict:paid&&paid.cpl?('Leads cost <b>'+money(paid.cpl)+'</b>'
      +(pp&&pp.cpl?', '+(paid.cpl>pp.cpl?'up':'down')+' from '+money(pp.cpl)+' in '+mon(pm):'')
      +(paid.cpl<CPLB?', '+Math.round((1-paid.cpl/CPLB)*100)+'% under the '+money(CPLB)+' benchmark'
        :', above the '+money(CPLB)+' benchmark')+'. '+num(paid.leads)+' leads'
      +(pp&&pp.leads!=null?' against '+num(pp.leads):'')+'.'
      +(pp&&pp.cpm&&Math.abs(pct(paid.cpm,pp.cpm))>=20?' Cost per 1,000 views went '+way(paid.cpm,pp.cpm)
        +' to '+money(paid.cpm)+(pp.ctr&&paid.ctr?', and the click rate moved from '+pp.ctr+'% to '+paid.ctr+'%':'')+'.':'')
      +(paid.comments?' '+paid.comments+' people commented on an ad.':''))
      :'No figures came back. Check the Meta token before concluding anything.'});

  F.push({key:'social',label:'Organic',note:'Instagram and the dated cards',
    head:num(me.reach),headsub:'accounts reached',
    tone:bd.cards&&!bd.with_reading?'bad':'good',pic:(posts[0]||{}).img,
    metrics:(ig?[['Instagram reach, account',num(ig.reach)],['Profile views',num(ig.profile_views)],
      ['Followers',num(ig.followers)],
      ['New followers',ig.new_followers==null?'—':num(ig.new_followers)],
      ['Engagement rate',ig.engagement_rate+'%'],
      ['Website clicks',num(ig.website_clicks),ig.website_clicks<5?'bad':null],
      ['Facebook fans',num(fb&&fb.fans)],['Facebook engagements',num(fb&&fb.page_engagements)],
      ['Facebook page views',num(fb&&fb.page_views)]]
      :[['Account figures held for the current month only','—']])
      .concat([['Posts published',num(me.posts)],['Reach, summed over posts',num(me.reach)],
      ['Reach per post',me.avg||'—'],['Interactions',num(me.acts)],
      ['Cards dated',num(bd.cards)],['Published',num(bd.published)],
      ['With a 72h reading',num(bd.with_reading),bd.cards&&!bd.with_reading?'bad':'good']])
      .concat(Object.keys(st).length?[['Still scheduled',num(st['Scheduled']||0),
        (st['Scheduled']||0)>5?'bad':null]]:[]),
    gallery:posts,
    verdict:(prev&&prev.avg&&me.avg
      ?'Reach per post went <b>'+way(me.avg,prev.avg)+'</b> to '+Math.round(me.avg)+', from '+Math.round(prev.avg)+' in '
        +mon(prev.m)+', on '+me.posts+' posts against '+prev.posts+'.'
        +(me.posts>=prev.posts&&me.avg<prev.avg?' Volume held, so posting more will not fix it.':'')
      :me.avg?'Each post reached '+Math.round(me.avg)+' people on average, across '+me.posts+' posts.':'No posts read this month.')
      +(posts[0]?' Best: '+(posts[0].first?'“'+esc(String(posts[0].first).slice(0,54))+'”':'an uncaptioned '+(posts[0].kind==='REELS'?'Reel':'post')+' from '+wd(posts[0].when)+' '+posts[0].when.slice(8))+', at '+num(posts[0].reach)+'.':'')
      +(running(CUR)?' The month is still running.':'')});

  F.push({key:'uploads',label:'By hand',note:"Sean's profile, LinkedIn and TikTok",
    head:num(tot.impressions),headsub:'profile impressions',
    tone:li.gap||tk.gap?'bad':'good',
    metrics:[["Sean’s profile posts",num(tot.posts)],
      ['Profile impressions',num(tot.impressions),tot.impressions>5000?'good':null],
      ['Profile interactions',num(tot.interactions)],
      ['Profile rate',tot.rate!=null?tot.rate+'%':'—',tot.rate>=5?'good':null],
      ['LinkedIn posts',li.gap?'not in the file':num(li.rows),li.gap?'bad':null],
      ['TikTok videos',tk.gap?'not in the file':num(tk.rows),tk.gap?'bad':null],
      ['Last refreshed',esc(up.last_updated?String(up.last_updated).split('·')[0].trim():'—')]],
    verdict:(tot.posts&&me.avg?'Sean’s own profile averages <b>'+num(Math.round(tot.impressions/tot.posts))
      +' impressions per post</b>, against '+Math.round(me.avg)+' reached per post on the Instagram page. ':'')
      +(li.gap||tk.gap?'LinkedIn and TikTok sent the wrong export, so neither can be read yet.':'')});

  F.push({key:'youtube',label:'YouTube',note:"Marissa's long-form, the source for every cut",
    head:num(vids.length||(yt.recent||[]).length),headsub:'recordings in hand',
    tone:vids.length?'good':'bad',pic:(vids[0]||{}).img,
    metrics:[['Subscribers',num(yt.subs)],['Views, all time',num(yt.views_total)],
      ['Videos on the channel',num(yt.videos_total)],['Recordings in hand',num(vids.length)]],
    vids:vids,
    verdict:vids.length?(()=>{const t=vids.slice().sort((a,b)=>(b.views||0)-(a.views||0))[0];
      return 'Most watched: <b>“'+esc(String(t.title).slice(0,96))+'”</b> at '+num(t.views)+' views, of '
        +vids.length+' recordings in hand.';})():'No recordings read this month.'});

  F.push({key:'funnel',label:'Funnel',note:'GetResponse, HubSpot and Zoom',
    head:money(fn.won_this_month),headsub:'won this month',
    tone:fn.won_this_month?'good':'bad',
    metrics:[['Subscribers',num(lc.subscriber)],['Leads',num(lc.lead)],
      ['Marketing qualified',num(lc.marketingqualifiedlead)],
      ['Sales qualified',num(lc.salesqualifiedlead)],['Customers',num(lc.customer)],
      ['From this campaign',num(fn.from_campaign)],
      ['Won this month',money(fn.won_this_month),fn.won_this_month?'good':'bad'],
      ['Won, all time',money(fn.won_total)],['Open pipeline',money(fn.open_total)],
      ['Webinar attendees',num(fn.webinar_attendees),
        !fn.webinar_attendees&&fn.webinar_sessions?'bad':null]],
    verdict:fn.won_this_month?'<b>'+money(fn.won_this_month)+' closed</b>'
        +(pfn.won_this_month!=null?', against '+money(pfn.won_this_month)+' in '+mon(pm):'')+'.'
      :'<b>Nothing closed</b>'+(pfn.won_this_month?', after '+money(pfn.won_this_month)+' in '+mon(pm):'')+'. '
        +(paid&&paid.leads?num(paid.leads)+' leads came in and '+num(lc.salesqualifiedlead||0)+' reached a sales conversation':'')
        +(fn.webinar_sessions?'; '+fn.webinar_sessions+' webinar sessions recorded '+num(fn.webinar_attendees||0)+' attendees':'')+'.'});

  const r=d.read||{},dz=r.directions||{};
  return {built:d.built||'',content:c,fronts:F,posts:posts,vids:vids,months:ms,me:me,prev:prev,
    direction:d.direction||null,
    paid:paid,read:r.lines||[],
    dirs:[['Marissa','what to produce',dz.marissa],['Valerie','what changes',dz.valerie],
          ['Marina','paid and the funnel',dz.marina]].filter(x=>x[2]),
    plan:d.plan||null,
    kpis:[['Spend',money(paid&&paid.spend),null],['Leads',num(paid&&paid.leads),null],
      ['Per lead',paid&&paid.cpl?money(paid.cpl):'—',
        paid&&paid.cpl&&paid.cpl<CPLB?'good':'bad'],
      ['Reach per post',me.avg||'—',null],
      ['Won',money(fn.won_this_month),fn.won_this_month?'good':'bad']]};
}

/* ---------------------------------------------------------------- pieces */
function hd(h,p){return '<div class="hd"><h2>'+h+'</h2>'+(p?'<p>'+p+'</p>':'')+'</div>';}
function fig(v,l,n,t){return '<div class="fig"><b'+(t?' class="'+t+'"':'')+'>'+v+'</b><span>'+l
  +'</span>'+(n?'<em>'+n+'</em>':'')+'</div>';}
function mrows(ms){return '<div class="mcols">'+ms.map(m=>'<div class="mrow"><span>'+m[0]
  +'</span><b'+(m[2]?' class="'+m[2]+'"':'')+'>'+m[1]+'</b></div>').join('')+'</div>';}

function postCard(p,i){
  const tags=[];
  if(p.kind) tags.push('<span class="tg f">'+esc(p.kind)+'</span>');
  if(p.pillar) tags.push('<span class="tg p">'+esc(p.pillar)+'</span>');
  tags.push('<span class="tg">'+wd(p.when)+' '+p.when.slice(8)+'</span>');
  if(!p.card) tags.push('<span class="tg u">untagged</span>');
  return '<a class="post" href="'+esc(p.url)+'" target="_blank" rel="noopener">'
    +'<div class="shot">'+(p.img?'<img src="'+esc(p.img)+'" alt="" loading="lazy">'
      :'<div class="none">No thumbnail held</div>')
    +'<span class="rk'+(i===0?' top':'')+'">'+(i===0?'Best':'#'+(i+1))+'</span>'
    +'<span class="re"><b>'+num(p.reach)+'</b><span>reached</span></span></div>'
    +'<div class="meta"><p class="first">'+esc(p.first)+'</p>'
    +'<div class="tags">'+tags.join('')+'</div>'
    +'<div class="nums"><div>Views<b>'+num(p.views)+'</b></div>'
    +'<div>Likes<b>'+num(p.likes)+'</b></div><div>Saves<b>'+num(p.saved)+'</b></div>'
    +'<div>Shares<b>'+num(p.shares)+'</b></div></div></div></a>';
}

function vidCard(v){
  return '<a class="vid" href="'+esc(v.url)+'" target="_blank" rel="noopener">'
    +'<div class="shot"><img src="'+esc(v.img)+'" alt="" loading="lazy">'
    +'<span class="v">'+num(v.views)+' views</span></div>'
    +'<p class="t">'+esc(v.title)+'</p></a>';
}


/* ---- contact sheet: ranked, sortable, and every row can carry a note ---- */
let SORT={k:'reach',d:-1},WHO=kept('who')||'',OPENNOTE=null;
const TEAM=['Marissa','Valerie','Marina','Rodney'];
const COLS=[['img','',''],['first','Post','t'],['pillar','Pillar','t'],['kind','Format','t'],
  ['cta','CTA','t'],['when','Date','t'],['reach','Reach','n'],['views','Views','n'],
  ['saved','Saves','n'],['shares','Shares','n'],['note','Note','']];

function sortPosts(ps){
  const k=SORT.k,d=SORT.d,num=COLS.filter(c=>c[0]===k)[0];
  const isN=num&&num[2]==='n';
  return ps.slice().sort((a,b)=>{
    let x=a[k],y=b[k];
    if(isN){x=x==null?-1:+x;y=y==null?-1:+y;return (x-y)*d;}
    x=String(x==null?'':x).toLowerCase();y=String(y==null?'':y).toLowerCase();
    return x<y?-1*d:x>y?1*d:0;
  });
}

async function saveNote(id,text){
  try{
    const r=await fetch(FB+'/'+CUR+'/notes/'+id+'.json',{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(text?{who:WHO||'Someone',text:text,
        at:new Date().toISOString()}:null)});
    if(!r.ok) throw new Error('bad status');
    const cur=ALL[CUR]||{};
    cur.notes=Object.assign({},cur.notes||{});
    if(text) cur.notes[id]={who:WHO||'Someone',text:text,at:new Date().toISOString()};
    else delete cur.notes[id];
    ALL[CUR]=cur;
  }catch(e){fail();}
}

function paneSheet(M){
  const notes=(ALL[CUR]||{}).notes||{};
  const ps=sortPosts(M.posts);
  const tagged=M.posts.filter(p=>p.card).length;
  let h=hd('What ran in '+nice(CUR), M.posts.length
    ? 'Every post, with the thumbnail, the caption and the fields off its card. <b>Click any '
      +'column to rank by it</b>, and add a note on the row it belongs to, so it reaches the '
      +'presentation attached to the thing it is about.'
    : 'Nothing published to Instagram in this month.');

  h+='<div class="who"><span>Notes are signed, so</span><select id="whoami">'
    +'<option value="">who are you?</option>'
    +TEAM.map(t=>'<option value="'+t+'"'+(t===WHO?' selected':'')+'>'+t+'</option>').join('')
    +'</select><b>'+Object.keys(notes).length+' note'
    +(Object.keys(notes).length===1?'':'s')+' on this month</b>'
    +'<span style="margin-left:auto">'+tagged+' of '+M.posts.length
    +' posts carry a card, so the Pillar and CTA columns are only as full as the board is.</span>'
    +'</div>';

  if(!M.posts.length) return h;

  h+='<div class="figs" style="margin-bottom:13px">'
    +M.kpis.map(k=>fig(k[1],k[0],'',k[2])).join('')+'</div>';

  h+='<div class="sheet"><table class="cs"><thead><tr><th></th>'
    +COLS.map(c=>c[1]?'<th class="'+(c[2]==='n'?'r ':'')+(SORT.k===c[0]?'on':'')
      +'" data-sort="'+c[0]+'">'+c[1]
      +(SORT.k===c[0]?'<span class="ar">'+(SORT.d<0?'▼':'▲')+'</span>':'')
      +'</th>':'<th></th>').join('')+'</tr></thead><tbody>';

  ps.forEach((p,i)=>{
    const n=notes[p.id];
    h+='<tr><td class="rank">'+(i+1)+'</td>'
      +'<td>'+(p.img?'<img class="csimg" src="'+esc(p.img)+'" alt="" loading="lazy">'
        :'<div class="csimg none">no thumb</div>')+'</td>'
      +'<td class="cscap"><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'
      +esc(p.first||'(no caption)')+'</a><small>'+(p.words||0)+' words'
      +(p.card?' · card '+p.card:'')+'</small></td>'
      +'<td>'+(p.pillar?'<span class="ch p">'+esc(p.pillar)+'</span>'
        :'<span class="ch u">untagged</span>')+'</td>'
      +'<td><span class="ch f">'+esc(p.kind||'')+'</span></td>'
      +'<td>'+(p.cta&&p.cta!=='—'?'<span class="ch">'+esc(p.cta)+'</span>':'')+'</td>'
      +'<td><span class="ch">'+wd(p.when)+' '+p.when.slice(8)+'</span></td>'
      +'<td class="n r">'+num(p.reach)+'</td><td class="n r">'+num(p.views)+'</td>'
      +'<td class="n r">'+num(p.saved)+'</td><td class="n r">'+num(p.shares)+'</td>'
      +'<td><button class="nb'+(n?' has':'')+'" data-note="'+p.id+'">'
      +(n?'note ✓':'+ note')+'</button></td></tr>';
    if(n&&OPENNOTE!==p.id) h+='<tr class="nrow"><td></td><td colspan="10">'
      +'<div class="note"><b>'+esc(n.who)+'</b> · '+esc(n.text)+'</div></td></tr>';
    if(OPENNOTE===p.id) h+='<tr class="nrow"><td></td><td colspan="10"><div class="nbox">'
      +'<textarea id="nt-'+p.id+'" placeholder="What you know about this post that the figures '
      +'do not. It goes on the slide with your name on it.">'+esc(n?n.text:'')+'</textarea>'
      +'<button class="nsave" data-save="'+p.id+'">Save</button></div></td></tr>';
  });

  h+='</tbody></table></div>'
    +'<p class="csfoot">Ranked by '+esc((COLS.filter(c=>c[0]===SORT.k)[0]||['','reach'])[1])
    +', '+(SORT.d<0?'highest first':'lowest first')+'. Reach is accounts reached, which is the '
    +'figure the direction is built on. Notes left here are carried into the month’s '
    +'presentation, under the post they are about.</p>';
  return h;
}

function wireSheet(){
  document.querySelectorAll('[data-sort]').forEach(t=>t.onclick=()=>{
    const k=t.dataset.sort;
    SORT=(SORT.k===k)?{k:k,d:-SORT.d}:{k:k,d:(COLS.filter(c=>c[0]===k)[0][2]==='n')?-1:1};
    render();wire();});
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{
    OPENNOTE=(OPENNOTE===b.dataset.note)?null:b.dataset.note;render();wire();
    const t=document.getElementById('nt-'+OPENNOTE);if(t)t.focus();});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.save,t=document.getElementById('nt-'+id);
    if(!t)return;
    b.textContent='Saving';
    await saveNote(id,t.value.trim());
    OPENNOTE=null;render();wire();});
  const w=document.getElementById('whoami');
  if(w) w.onchange=()=>{WHO=w.value;keep('who',WHO);};
}

/* ---------------------------------------------------------------- panes */
function paneMonth(M){
  const ms=M.months.slice().reverse();
  const top=Math.max.apply(null,ms.map(x=>x.avg).concat([1]));
  let move='';
  if(M.prev&&M.prev.avg&&M.me.avg){
    const pc=Math.round((M.me.avg-M.prev.avg)/M.prev.avg*100);
    move=' Reach per post is <b>'+(pc>=0?'up ':'down ')+Math.abs(pc)+'%</b> on '
      +shortm(M.prev.m)+', '+M.me.avg+' against '+M.prev.avg+'.';
  }
  const best=M.posts[0];
  return hd(nice(CUR),'<b>'+M.me.posts+' posts</b> went out on Instagram and reached <b>'
    +num(M.me.reach)+' accounts</b>, with '+num(M.me.acts)+' interactions.'+move
    +(best?' The best was “'+esc(String(best.first).slice(0,58))+'…” at '
      +num(best.reach)+'.':''))
    +'<div class="figs">'+M.kpis.map(k=>fig(k[1],k[0],'',k[2])).join('')+'</div>'
    +'<div class="card t-month" style="margin-top:13px"><div class="fh"><h3>Reach per post, '
    +'month by month</h3></div><div class="bars">'+ms.map(x=>
      '<div class="brow"><span class="bm">'+shortm(x.m)+'</span><span class="bt"><i'
      +(x.m===CUR?' class="now"':'')+' style="width:'+Math.max(2,x.avg/top*100)+'%"></i></span>'
      +'<span class="bv">'+x.avg+'<small>'+x.posts+' posts · '+num(x.reach)
      +' total</small></span></div>').join('')
    +'</div><p class="axis">The one social figure volume cannot flatter. Bars share a scale, so '
    +'the lengths compare month to month. Gold is the month on screen.</p></div>';
}

/* One number and one sentence. The rest of the figures are there, folded away, for whoever
   wants to check the sentence. The posts themselves live in What ran. */
function paneFront(f){
  let s=hd(f.label,esc(f.note))
    +'<div class="card t-'+f.key+'"><div class="hero"><b'+(f.tone?' class="'+f.tone+'"':'')+'>'
    +f.head+'</b><span>'+esc(f.headsub)+'</span></div>'
    +'<p class="verdict">'+f.verdict+'</p>'
    +(f.metrics.length?'<details class="more"><summary>All '+f.metrics.length+' figures</summary>'
      +mrows(f.metrics)+'</details>':'')+'</div>';
  if(f.vids&&f.vids.length) s+='<div class="card"><div class="fh"><h3>The recordings</h3></div>'
    +'<div class="yt">'+f.vids.map(vidCard).join('')+'</div></div>';
  return s;
}

/* Next month, proposed from this month's numbers by the rules in skles_session_build.py.
   The team argues with it in What you think; the deck and the email are built from it. */
function paneDirection(M){
  const dr=M.direction,pts=(dr&&dr.points)||[];
  if(!pts.length) return hd('Next month','The direction is written on the 26th, once the month’s '
    +'numbers are in.');
  const said=SAYS.filter(s=>s[0]!=='marina').map(s=>[s[1],!!(((ALL[CUR]||{})[s[0]]||{}).text)]);
  return hd('What we do in '+mon(nextKey(CUR)),'Proposed from '+nice(CUR)
    +'’s numbers. Each point names its owner and the evidence behind it. If one is wrong, say so in '
    +'<b>What you think</b> and it goes into the plan.')
    +pts.map((p,i)=>'<div class="card dp"><div class="dpn">'+(i+1)+'</div><div><span class="own">'
      +esc(OWNER[p.owner]||p.owner)+'</span><h3>'+esc(p.text)+'</h3><p class="ev">'+esc(p.why)+'</p>'
      +(p.impact?'<p class="imp">'+esc(p.impact)+'</p>':'')+'</div></div>').join('')
    +(dr.ask?'<div class="card ask"><span class="own">The one decision for Sean</span><h3>'+esc(dr.ask)+'</h3></div>':'')
    +'<div class="card said"><p>'+said.map(x=>'<b>'+x[0]+'</b> '+(x[1]?'has added a view':'has not added a view yet')).join(' · ')
    +'</p><button class="go" data-pick="says">Open What you think</button></div>';
}
const nextKey=m=>{let y=+m.slice(0,4),n=+m.slice(5)+1;if(n>12){n=1;y++;}return y+'-'+String(n).padStart(2,'0');};

function paneRan(M){
  const tagged=M.posts.filter(p=>p.card).length;
  return hd('What ran in '+nice(CUR),M.posts.length
    ? 'Ranked by accounts reached, best first. Every thumbnail opens the real post. <b>'+tagged
      +' of '+M.posts.length+'</b> are tagged to an ops-board card, which is what lets the next '
      +'section say why one beat another.'
    : 'Nothing published to Instagram in this month.')
    +(M.posts.length?'<div class="gal">'+M.posts.map(postCard).join('')+'</div>':'');
}

function paneSays(){
  return hd('What you think','Where the direction is wrong, or where it is missing something only '
    +'you can see.')
    +SAYS.map(s=>'<div class="box"><div class="bh"><h3>'+s[1]+'</h3><span class="role">'+s[2]
      +'</span><span class="state" data-s="'+s[0]+'">empty</span></div><textarea data-k="'+s[0]
      +'" placeholder="'+s[3]+'"></textarea></div>').join('')
    +'<p class="hint">Saves on its own a second after you stop typing. Everyone sees the same page.</p>';
}

function paneHist(){
  return hd('Every month we have run','A direction that turned out wrong is only useful if it is '
    +'still readable later.')
    +'<div class="box"><table><thead><tr><th>Month</th><th class="r">Posts</th>'
    +'<th class="r">Reach per post</th><th class="r">Leads</th><th class="r">Per lead</th>'
    +'<th>Plan</th></tr></thead><tbody>'
    +Object.keys(ALL).sort().reverse().map(m=>{
      const d=ALL[m]||{},paid=((d.fronts||{}).paid||{}).data||{},p=d.plan||{};
      const mm=((d.content||{}).months||[]).filter(x=>x.m===m)[0]||{};
      return '<tr><td><a href="#" data-go="'+m+'">'+nice(m)+'</a></td><td class="r">'
        +(mm.posts||'—')+'</td><td class="r">'+(mm.avg||'—')+'</td><td class="r">'
        +num(paid.leads)+'</td><td class="r">'+(paid.cpl?money(paid.cpl):'—')+'</td><td>'
        +(p.url?'<a href="'+esc(p.url)+'">'+esc(p.title||'Plan')+'</a>':'—')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ---------------------------------------------------------------- list + render */
const GROUPS=[['Next month',['direction']],['The month',['month','ran']],
  ['Each front',['paid','social','uploads','youtube','funnel']],['Your view',['says']],['The record',['hist']]];
function items(M){
  const pts=((M.direction||{}).points)||[];
  const L=[{id:'direction',name:'Direction',sub:'what we do next, and who owns it',
    fig:pts.length||'—',tone:pts.length?'good':'',pic:null},
    {id:'month',name:'The month',sub:'the picture in five figures',fig:M.me.avg||'—',tone:'',pic:null}];
  M.fronts.forEach(f=>L.push({id:f.key,name:f.label,sub:f.note,fig:f.head,tone:f.tone,
    pic:f.pic,front:f}));
  L.push({id:'ran',name:'What ran',sub:'every post, ranked, notes per post',
    fig:M.posts.length,tone:M.posts.length?'good':'bad',pic:(M.posts[0]||{}).img});
  const filled=SAYS.filter(s=>((ALL[CUR]||{})[s[0]]||{}).text).length;
  L.push({id:'says',name:'What you think',sub:'Marissa, Valerie, Marina',
    fig:filled+'/3',tone:filled?'good':'',pic:null});
  L.push({id:'hist',name:'Every month',sub:'the whole record',
    fig:Object.keys(ALL).length,tone:'',pic:null});
  return L;
}

function btn(x){
  const on=x.id===SEL;
  return '<button class="it'+(on?'':' t-'+x.id)+'" data-id="'+x.id+'" aria-current="'+on+'">'
    +(x.pic?'<img class="pic" src="'+esc(x.pic)+'" alt="" loading="lazy">'
      :'<span class="dot '+(x.tone||'')+'"></span>')
    +'<span class="nm">'+esc(x.name)+'</span>'
    +'<span class="fig">'+x.fig+'</span>'
    +'<span class="sb">'+esc(x.sub)+'</span></button>';
}

function pane(M,L){
  const it=L.filter(x=>x.id===SEL)[0]||L[0];
  if(it.front) return paneFront(it.front);
  if(SEL==='direction') return paneDirection(M);
  if(SEL==='month') return paneMonth(M);
  if(SEL==='ran') return paneSheet(M);
  if(SEL==='says') return paneSays();
  return paneHist();
}

function render(){
  const M=model(ALL[CUR]||{}),L=items(M);
  if(!L.filter(x=>x.id===SEL).length) SEL=L[0].id;
  document.getElementById('title').textContent=nice(CUR)+' review';
  document.getElementById('built').textContent=M.built?'Numbers as at '+M.built:'';
  const by={};L.forEach(x=>by[x.id]=x);
  document.getElementById('list').innerHTML=GROUPS.map(g=>'<div class="lh">'+g[0]+'</div>'
      +g[1].filter(id=>by[id]).map(id=>btn(by[id])).join('')).join('')
    +'<p class="kbd"><b>&uarr;</b> <b>&darr;</b> walks the list.</p>';
  document.getElementById('detail').innerHTML=pane(M,L);
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>pick(b.dataset.id));
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick));
  document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{
    e.preventDefault();show(a.dataset.go);});
  wireSheet();
}

function pick(id){SEL=id;keep('sel',id);render();wire();
  const d=document.querySelector('.detail');if(d)d.scrollTop=0;}

/* localStorage is a per-viewer convenience: it can throw, and the page renders the same without it. */
function keep(k,v){try{localStorage.setItem('skles-con-'+k,v);}catch(e){}}
function kept(k){try{return localStorage.getItem('skles-con-'+k);}catch(e){return null;}}

const timers={};
function mark(k,v){document.querySelectorAll('[data-s="'+k+'"]').forEach(s=>{
  s.textContent=v&&v.trim()?'in':'empty';s.classList.toggle('in',!!(v&&v.trim()));});}

async function save(path,value){
  try{
    const r=await fetch(FB+'/'+CUR+'.json',{method:'PATCH',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({[path]:value})});
    if(!r.ok) throw new Error('bad status');
    ALL[CUR]=Object.assign({},ALL[CUR],{[path]:value});
  }catch(e){fail();}
}

function wire(){
  document.querySelectorAll('textarea[data-k]').forEach(el=>{
    const k=el.dataset.k,cur=ALL[CUR]||{};
    el.value=(cur[k]&&cur[k].text)||'';mark(k,el.value);
    el.oninput=()=>{clearTimeout(timers[k]);
      document.querySelectorAll('[data-s="'+k+'"]').forEach(s=>{
        s.textContent='typing';s.classList.remove('in');});
      timers[k]=setTimeout(async()=>{
        await save(k,{text:el.value,saved:new Date().toISOString()});mark(k,el.value);},1000);};
  });
  const pu=document.getElementById('planurl');
  if(pu){
    pu.value=((ALL[CUR]||{}).plan||{}).url||'';
    pu.oninput=()=>{clearTimeout(timers.plan);
      timers.plan=setTimeout(async()=>{
        const v=pu.value.trim();if(!v)return;
        await save('plan',{url:v,title:(((ALL[CUR]||{}).plan)||{}).title||nice(CUR)+' plan'});
        render();wire();},1200);};
  }
}

document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')) return;
  const ids=[].slice.call(document.querySelectorAll('.it')).map(b=>b.dataset.id);
  const i=ids.indexOf(SEL);if(i<0)return;
  e.preventDefault();
  pick(ids[(i+(e.key==='ArrowDown'?1:ids.length-1))%ids.length]);
});

function show(m){CUR=m;document.getElementById('pick').value=m;render();wire();}

(async function init(){
  try{const r=await fetch(FB+'.json');if(r.ok)ALL=(await r.json())||{};}catch(e){fail();}
  const months=Object.keys(ALL).sort().reverse();
  if(!months.length){fail();return;}
  SEL=kept('sel')||'direction';
  const p=document.getElementById('pick');
  p.innerHTML=months.map(m=>'<option value="'+m+'">'+nice(m)+'</option>').join('');
  p.onchange=e=>show(e.target.value);
  show(months[0]);
})();
</script>
</body>
</html>
