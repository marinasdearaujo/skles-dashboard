<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKLES · Where we are</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#112250; --navy-soft:#3d4d78; --tan:#E0C58F; --tan-deep:#8a6a24;
    --bg:#F5F0E6; --card:#FFFFFF; --line:#E7DFCD; --muted:#6B7A93;
    --good:#1E8E5A; --warn:#B8791A; --bad:#C1443E;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--navy);
       font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 24px 90px}

  header{padding:52px 0 10px}
  .brand{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:19px;letter-spacing:.4px}
  .brand span{color:var(--tan-deep)}
  .stamp{font-size:12px;color:var(--muted);margin-top:3px}

  .verdict{font-family:'Merriweather',Georgia,serif;font-weight:700;font-size:clamp(21px,3.3vw,29px);
           line-height:1.35;margin:34px 0 8px;letter-spacing:-.2px}
  .verdict em{font-style:normal;color:var(--tan-deep)}
  .verdict-sub{color:var(--muted);font-size:14px;max-width:62ch}

  h2{font-size:10.5px;text-transform:uppercase;letter-spacing:2.2px;color:var(--muted);
     font-weight:700;margin:52px 0 16px}

  /* the month, four numbers and nothing else */
  .month{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
         background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .m{background:var(--card);padding:20px 22px}
  .m .k{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:600}
  .m .v{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:31px;line-height:1.1;margin-top:7px}
  .m .t{font-size:12px;color:var(--muted);margin-top:3px}
  .m .t b{font-weight:700}
  .ok{color:var(--good)} .off{color:var(--warn)} .no{color:var(--bad)}

  /* funnel: a plain vertical list, no chrome */
  .fn{border-left:2px solid var(--line);margin-left:9px;padding-left:0}
  .fs{position:relative;padding:0 0 4px 26px}
  .fs::before{content:'';position:absolute;left:-7px;top:9px;width:12px;height:12px;border-radius:50%;
              background:var(--card);border:2px solid var(--navy-soft)}
  .fs.leak::before{border-color:var(--bad);background:var(--bad)}
  .fs.dead::before{border-color:var(--bad);background:var(--card)}
  .fs .n{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:26px;line-height:1.2}
  .fs .n small{font-family:'Poppins';font-size:13px;font-weight:500;color:var(--muted);margin-left:9px}
  .fs .d{font-size:13px;color:var(--muted);padding-bottom:20px;max-width:60ch}
  .drop{font-size:12px;color:var(--muted);padding:0 0 16px 26px;margin-top:-14px}
  .drop b{font-family:'Merriweather';font-size:14px;color:var(--navy)}
  .drop.bad b{color:var(--bad)}

  /* what it takes */
  .takes{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 26px}
  .takes .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
  .takes .row:last-child{border-bottom:none;padding-bottom:0}
  .takes .row:first-child{padding-top:0}
  .takes .big{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:22px}
  .takes .lbl{font-size:13px;color:var(--muted);flex:1;min-width:200px}
  .swap{margin-top:18px;padding:15px 18px;background:rgba(224,197,143,.22);border-radius:9px;
        font-size:13.5px;line-height:1.6}
  .swap b{font-weight:700}

  /* attention */
  .att{display:flex;flex-direction:column;gap:10px}
  .a{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--bad);
     border-radius:9px;padding:15px 18px;font-size:13.5px;line-height:1.55}
  .a.warn{border-left-color:var(--warn)}
  .a b{display:block;margin-bottom:2px}
  .a span{color:var(--muted)}

  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
         font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px}
  footer a{color:var(--tan-deep)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">SKLES<span>.</span></div>
    <div class="stamp" id="stamp">Loading</div>
  </header>

  <div class="verdict" id="verdict"></div>
  <div class="verdict-sub" id="verdict-sub"></div>

  <h2>This month</h2>
  <div class="month" id="month"></div>

  <h2>The funnel</h2>
  <div class="fn" id="funnel"></div>

  <h2>What one Protégé sale takes</h2>
  <div class="takes" id="takes"></div>

  <h2>Needs attention</h2>
  <div class="att" id="attention"></div>

  <footer>
    <span>Live from Meta, refreshed every 3 hours. Sales entered by hand.</span>
    <a href="index.html">Full dashboard →</a>
    <a href="ops-board.html">Ops Board →</a>
  </footer>
</div>

<script src="skles-dashboard-data.js"></script>
<script src="skles-organic-data.js"></script>
<script src="skles-sales-data.js"></script>
<script>
(function(){
  var D=window.SKLES_DATA||{}, O=window.SKLES_ORGANIC||{}, S=window.SKLES_SALES||{};
  var c=D.campaigns||{}, e=c.ebook||{}, w=c.webinar||{};
  var n=function(v){return +(v||0)}, f=function(v){return Math.round(n(v)).toLocaleString('en-US')};
  var g=function(id){return document.getElementById(id)};

  var igReach=((((O.windows||{})['30']||{}).ig)||{}).reach||0;
  var aware=n(e.reach)+n(w.reach)+n(igReach);
  var leads=n(e.leads), qual=n(e.registrations)+n(w.registrations), appr=n(S.apprentice_total), prot=n(S.protege_total);
  var spend=n(e.spend)+n(w.spend);
  var cplRecent=6.32;

  var key=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  var plan=(S.plan||{})[key]||{};

  g('stamp').textContent='Where we are · '+(D.last_updated||'');

  // rates
  var rQual=leads?qual/leads*100:0, rAppr=qual?appr/qual*100:0;

  g('verdict').innerHTML='The funnel works right up to the webinar, <em>then it stops.</em>';
  g('verdict-sub').textContent=
    f(leads)+' people took the guide and '+f(qual)+' registered for the training, which is a good rate. '
    +'Only '+appr+' became a member, and nothing yet has sold Protégé, where the money is.';

  // ---- this month ----
  function tile(k,v,t,cls){
    return '<div class="m"><div class="k">'+k+'</div><div class="v'+(cls?' '+cls:'')+'">'+v+'</div>'
         + (t?'<div class="t">'+t+'</div>':'')+'</div>';
  }
  var leadCls = plan.leads ? (leads>=plan.leads?'ok':'off') : '';
  var apprCls = plan.active_members ? (appr>=plan.active_members?'ok':'no') : '';
  g('month').innerHTML =
      tile('Leads', f(leads), plan.leads?('target <b>'+plan.leads+'</b>'):'', leadCls)
    + tile('Members', f(appr), plan.active_members?('target <b>'+plan.active_members+'</b>'):'', apprCls)
    + tile('Protégé', f(prot), 'target <b>'+(plan.protege||0)+'</b>', prot>=(plan.protege||0)?'':'no')
    + tile('Ad spend', '$'+f(spend), '$'+cplRecent.toFixed(2)+' a lead');

  // ---- funnel ----
  var stages=[
    {n:aware,   u:'reached',       d:'Ads and Instagram put SKLES in front of them.'},
    {n:leads,   u:'took the guide',d:'Gave us an email address.'},
    {n:qual,    u:'registered',    d:'Signed up for the recorded training on their own.'},
    {n:appr,    u:'became members',d:'Apprentice, $8.99 a month.', leak:true},
    {n:prot,    u:'bought Protégé',d:'Nothing in the funnel links to or mentions it.', dead:true}
  ];
  var html='', prev=null;
  stages.forEach(function(s){
    if(prev!==null){
      var p=prev>0?(s.n/prev*100):0;
      var bad=p<5;
      html+='<div class="drop'+(bad?' bad':'')+'"><b>'+(p>=10?p.toFixed(0):p.toFixed(1))+'%</b> carried through</div>';
    }
    html+='<div class="fs'+(s.leak?' leak':'')+(s.dead?' dead':'')+'">'
        + '<div class="n">'+f(s.n)+'<small>'+s.u+'</small></div>'
        + '<div class="d">'+s.d+'</div></div>';
    prev=s.n;
  });
  g('funnel').innerHTML=html;

  // ---- what it takes ----
  var asc=0.10;
  var needAppr=1/asc, needQual=rAppr?needAppr/(rAppr/100):0, needLeads=rQual?needQual/(rQual/100):0;
  var needSpend=needLeads*cplRecent;
  var betterQual=needAppr/0.10, betterLeads=rQual?betterQual/(rQual/100):0, betterSpend=betterLeads*cplRecent;
  g('takes').innerHTML =
      '<div class="row"><span class="big">'+f(needAppr)+'</span><span class="lbl">members, assuming 1 in 10 goes on to Protégé</span></div>'
    + '<div class="row"><span class="big">'+f(needQual)+'</span><span class="lbl">registrations, at the '+rAppr.toFixed(1)+'% that become members today</span></div>'
    + '<div class="row"><span class="big">'+f(needLeads)+'</span><span class="lbl">guide downloads, at the '+rQual.toFixed(0)+'% that register today</span></div>'
    + '<div class="row"><span class="big">$'+f(needSpend)+'</span><span class="lbl">of ads, at $'+cplRecent.toFixed(2)+' a lead</span></div>'
    + '<div class="swap">The quarter has <b>$1,170</b> budgeted, so that does not add up. '
    + 'But lift registrations-to-members from <b>'+rAppr.toFixed(1)+'% to 10%</b> and the same sale needs only '
    + '<b>'+f(betterLeads)+' leads</b> and <b>$'+f(betterSpend)+'</b>. Fixing the funnel is far cheaper than buying around it.</div>';

  // ---- attention ----
  var items=[];
  items.push(['bad','Only '+rAppr.toFixed(1)+'% of registrations become members','This one number decides whether any budget works. Everything else in the funnel is healthy.']);
  if(S.protege_path_built===false)
    items.push(['bad','Protégé has no acquisition path','Nothing across 43 emails, the Apprentice page or the ebook funnel links to or mentions the $2,499 product.']);
  items.push(['warn','Outreach and email sends are not tracked','Rodney’s calls and the nurture sequence are invisible, so we cannot tell what is working at the bottom of the funnel.']);
  g('attention').innerHTML=items.map(function(i){
    return '<div class="a '+(i[0]==='warn'?'warn':'')+'"><b>'+i[1]+'</b><span>'+i[2]+'</span></div>';
  }).join('');
})();
</script>
</body>
</html>
