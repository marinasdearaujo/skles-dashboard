<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKLES · Funnel</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#112250;--soft:#5d6b7e;--tan:#E0C58F;--tan-deep:#8a6a24;
        --bg:#F5F0E6;--card:#FFF;--line:#E7DFCD;--line2:#F0EADC;
        --good:#1E8E5A;--warn:#B8791A;--bad:#C1443E}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--navy);font-family:'Poppins',-apple-system,Arial,sans-serif;
       font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:0 22px 80px}
  h2{font-size:10px;text-transform:uppercase;letter-spacing:2.2px;color:var(--soft);font-weight:700;margin:40px 0 13px}
  h2 .hint{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;margin-left:9px;opacity:.85}
  header{padding:34px 0 0}
  .brand{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:18px}
  .brand span{color:var(--tan-deep)}
  .stamp{font-size:11.5px;color:var(--soft);margin-top:2px}
  .filters{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 11px;margin-top:16px;
           border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:transparent;padding:6px 11px;font:600 11.5px 'Poppins';color:var(--soft);cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff}
  .seg button:hover:not(.on){background:var(--line2)}
  .flabel{font-size:9.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--soft);font-weight:700}
  .custom{display:none;gap:5px;align-items:center}
  .custom.on{display:flex}
  .custom input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:500 11.5px 'Poppins';color:var(--navy);background:var(--card)}
  .fn{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
  .fr{display:grid;grid-template-columns:20px 1.7fr 88px 92px 66px;gap:11px;align-items:center;
      padding:14px 17px;border-bottom:1px solid var(--line2);cursor:pointer}
  .fr:last-of-type{border-bottom:none}
  .fr:hover{background:var(--line2)}
  .fr .caret{color:var(--soft);font-size:10px;transition:transform .18s}
  .fr.open .caret{transform:rotate(90deg)}
  .fr .name{font-weight:600;font-size:13.5px}
  .fr .name small{display:block;font-weight:400;font-size:11px;color:var(--soft);margin-top:1px}
  .fr .num{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:20px;text-align:right}
  .fr .num.na{font-family:'Poppins';font-size:12px;font-weight:500;color:var(--soft)}
  .fr .goal{text-align:right;font-size:12px;color:var(--soft)}
  .fr .pct{text-align:right;font-size:11.5px;font-weight:700}
  .pct.ok{color:var(--good)}.pct.off{color:var(--warn)}.pct.no{color:var(--bad)}.pct.na{color:var(--soft);font-weight:400}
  .step{padding:2px 0 2px 48px;font-size:11px;color:var(--soft)}
  .step b{font-family:'Merriweather';color:var(--navy);font-size:12.5px}
  .step.bad b{color:var(--bad)}
  .drill{display:none;padding:2px 17px 16px 48px;border-bottom:1px solid var(--line2);background:#FDFBF6}
  .drill.on{display:block}
  .dsec{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;color:var(--soft);font-weight:700;margin:12px 0 5px}
  .dsec:first-child{margin-top:4px}
  .dch{display:grid;grid-template-columns:1fr 78px 118px;gap:11px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
  .dch:last-child{border-bottom:none}
  .dch .v{text-align:right;font-weight:700;font-family:'Merriweather';font-size:14px}
  .dch .g{text-align:right;font-size:11px;color:var(--soft)}
  .dch.dim{opacity:.5}
  .dch.dim .v{font-family:'Poppins';font-size:12px;font-weight:500}
  .cv{margin-top:8px}
  .cvh{border:1px solid var(--line);border-left:3px solid var(--tan-deep);border-radius:12px;background:var(--card);padding:16px 19px;margin-bottom:12px}
  .cvh h3{font-family:'Merriweather',Georgia,serif;font-size:17px;font-weight:900}
  .cvh .job{font-size:11.5px;color:var(--soft);margin-top:3px}
  .cvh .ns{font-size:11px;color:var(--tan-deep);font-weight:600;margin-top:6px}
  .cvk{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .cvk .c{background:var(--card);padding:15px 17px}
  .cvk .k{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--soft);font-weight:700}
  .cvk .v{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:23px;margin-top:5px;line-height:1.1}
  .cvk .s{font-size:10.5px;color:var(--soft);margin-top:3px}
  .cvk .s b{font-weight:700}
  .cvk .s.ok b{color:var(--good)}.cvk .s.off b{color:var(--warn)}.cvk .s.no b{color:var(--bad)}
  .cvt{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .cvt th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--soft);
          font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line)}
  .cvt td{padding:10px 14px;border-bottom:1px solid var(--line2)}
  .cvt tr:last-child td{border-bottom:none}
  .cvt .n{font-family:'Merriweather';font-weight:900;text-align:right}
  .cvt .g{text-align:right;color:var(--soft)}
  .cvt .st{text-align:right;font-weight:700;font-size:11px}
  .cvt .st.ok{color:var(--good)}.cvt .st.off{color:var(--warn)}.cvt .st.no{color:var(--bad)}.cvt .st.na{color:var(--soft);font-weight:400}
  .gap{border:1px dashed var(--line);border-radius:12px;padding:18px 20px;background:rgba(255,255,255,.5);
       font-size:12.5px;color:var(--soft);line-height:1.6}
  .gap b{color:var(--navy)}
  .econ{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
        border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .e{background:var(--card);padding:16px 18px}
  .e .k{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--soft);font-weight:700}
  .e .v{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:24px;margin-top:5px;line-height:1.1}
  .e .s{font-size:11px;color:var(--soft);margin-top:3px}
  .assump{margin-top:9px;font-size:11.5px;color:var(--soft)}
  .assump input{background:transparent;border:none;border-bottom:1px dashed var(--tan-deep);color:var(--tan-deep);
                width:42px;text-align:center;font-weight:700;font-family:'Poppins';font-size:11.5px}
  .okr{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
  .o{padding:14px 17px;border-bottom:1px solid var(--line2)}
  .o:last-child{border-bottom:none}
  .o .t{font-weight:600;font-size:13px;margin-bottom:8px}
  .o .t span{color:var(--tan-deep);font-family:'Merriweather';margin-right:6px}
  .kr{display:grid;grid-template-columns:1fr 112px 92px 44px;gap:11px;align-items:center;padding:4px 0;font-size:12.5px;color:var(--soft)}
  .kv{text-align:right;font-size:11.5px;white-space:nowrap}
  .kv b{font-family:'Merriweather';font-size:13px;color:var(--navy);font-weight:900}
  .kv s{opacity:.55}
  .bar{height:5px;background:var(--line2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--good);border-radius:99px}
  .bar i.off{background:var(--warn)}.bar i.no{background:var(--bad)}
  .kr .p{text-align:right;font-weight:700;font-size:11px;color:var(--navy)}
  .kr .p.na{color:var(--soft);font-weight:400;font-size:10px}
  footer{margin-top:46px;padding-top:17px;border-top:1px solid var(--line);font-size:11px;color:var(--soft);
         display:flex;flex-wrap:wrap;gap:7px 15px}
  footer a{color:var(--tan-deep)}
  @media(max-width:720px){
    .fr{grid-template-columns:18px 1fr 62px 56px;gap:8px}.fr .goal{display:none}
    .drill{padding-left:20px}.dch{grid-template-columns:1fr 62px}.dch .g{display:none}
    .kr{grid-template-columns:1fr 92px 38px}.kr .bar{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">SKLES<span>.</span></div>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="filters">
    <span class="flabel">Period</span>
    <div class="seg" id="seg-range"></div>
    <div class="custom" id="custom">
      <input type="date" id="d-from"><span style="color:var(--soft)">&rarr;</span><input type="date" id="d-to">
    </div>
    <span class="flabel" style="margin-left:6px">View</span>
    <div class="seg" id="seg-chan"></div>
  </div>
  <div id="chanview"></div>
  <h2 id="fn-head">The funnel <span class="hint">the five stages from the Sept&ndash;Nov plan &middot; click one to open it</span></h2>
  <div class="fn" id="funnel"></div>
  <h2>Unit economics</h2>
  <div class="econ" id="econ"></div>
  <div class="assump" id="assump"></div>
  <h2>OKRs <span class="hint">measured over the whole cycle, not the filter</span></h2>
  <div class="okr" id="okrs"></div>
  <footer>
    <span id="foot-note"></span>
    <a href="index.html">Full report &rarr;</a>
    <a href="submit.html">Submit numbers &rarr;</a>
    <a href="ops-board.html">Ops Board &rarr;</a>
  </footer>
</div>
<script src="skles-dashboard-data.js"></script>
<script src="skles-organic-data.js"></script>
<script src="skles-youtube-data.js"></script>
<script src="skles-sales-data.js"></script>
<script>
(function(){
var D=window.SKLES_DATA||{},O=window.SKLES_ORGANIC||{},Y=window.SKLES_YOUTUBE||{},S=window.SKLES_SALES||{};
var C=D.campaigns||{}, K=S.kpis||{};
var n=function(v){return +(v||0)}, g=function(i){return document.getElementById(i)};
var f=function(v){return Math.round(n(v)).toLocaleString('en-US')};
var money=function(v){return '$'+n(v).toLocaleString('en-US',{maximumFractionDigits:0})};

/* Numbers the team submits on submit.html live in the same Firebase as the Ops
   Board. Merge them over the static file so nobody has to redeploy to update a
   figure, and so an empty field stays "not tracked" rather than becoming a zero. */
function applySubmitted(m){
  if(!m) return;
  var w=m.weekly||{}, e=m.email||{}, z=m.zoom||{}, sl=m.sales||{};
  S.kpis=S.kpis||{}; var K0=S.kpis;
  K0.tof=K0.tof||{}; K0.nurture=K0.nurture||{}; K0.webinar=K0.webinar||{}; K0.meeting=K0.meeting||{}; K0.retention=K0.retention||{};
  function set(o,k,v){ if(v!==null&&v!==undefined&&v!=='') o[k]=+v; }
  set(K0.tof,'tiktok_views',w.tiktok_views);
  set(K0.tof,'linkedin_impressions',w.linkedin_impressions);
  set(K0.nurture,'guide_delivery_open',e.guide_delivery_open);
  set(K0.nurture,'broadcast_open',e.broadcast_open);
  set(K0.nurture,'broadcast_click',e.broadcast_click);
  set(K0.nurture,'webinar_invite_click',e.webinar_invite_click);
  set(K0.webinar,'live_attendees',z.live_attendees);
  set(K0.meeting,'registered',z.meeting_registered);
  set(K0.meeting,'participants',z.meeting_participants);
  set(K0.meeting,'sales',z.meeting_sales);
  set(S,'apprentice_total',sl.apprentice_total);
  set(S,'protege_total',sl.protege_total);
  set(K0.retention,'churned',sl.churned);
  set(K0.retention,'active_members',sl.apprentice_total);
  // outreach is a log, so count it rather than reading a field
  var log=m.outreach? Object.keys(m.outreach).map(function(k){return m.outreach[k]}) : null;
  if(log){
    K0.retention.outreach_contacts = log.length;
    K0.retention.outreach_converted = log.filter(function(o){return o.outcome==='joined'}).length;
  }
  S._submitted_by=m.updated_by; S._submitted_at=m.updated_at;
}

var ST={range:'month', chan:'funnel', open:null, retention:12, ascension:10, from:null, to:null};
var RANGES=[{k:'day',l:'Today'},{k:'week',l:'Week'},{k:'month',l:'Month'},{k:'quarter',l:'Quarter'},{k:'all',l:'Since launch'},{k:'custom',l:'Custom'}];
var VIEWS=[{k:'funnel',l:'Funnel'},{k:'paid',l:'Meta Paid'},{k:'ig',l:'Instagram'},{k:'fb',l:'Facebook'},{k:'yt',l:'YouTube'},{k:'email',l:'Email'},{k:'outreach',l:'Outreach'}];

function bounds(){
  var to=new Date(), from=new Date();
  if(ST.range==='day') from.setHours(0,0,0,0);
  else if(ST.range==='week') from.setDate(from.getDate()-7);
  else if(ST.range==='month') from=new Date(to.getFullYear(),to.getMonth(),1);
  else if(ST.range==='quarter') from=new Date(to.getFullYear(),Math.floor(to.getMonth()/3)*3,1);
  else if(ST.range==='custom'){
    from=ST.from?new Date(ST.from+'T00:00:00'):new Date(2000,0,1);
    to  =ST.to  ?new Date(ST.to+'T23:59:59'):new Date();
  } else from=new Date(2000,0,1);
  return {from:from,to:to};
}
function periodDays(){
  if(ST.range==='all') return null;
  var b=bounds();
  return Math.max(1, Math.round((b.to-b.from)/86400000)+(ST.range==='day'?1:0));
}
/* Goals are monthly. A shorter window gets a proportional slice, otherwise the
   goal never moved and every short period looked like a miss. */
function prorate(monthly){
  if(monthly===null||monthly===undefined) return null;
  var d=periodDays(); if(d===null) return null;
  if(ST.range==='month') return monthly;
  var inMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  return monthly*(d/inMonth);
}
function paid(){
  var b=bounds(), t={spend:0,reach:0,impr:0,clicks:0,leads:0,regs:0};
  ['ebook','webinar'].forEach(function(k){
    ((C[k]||{}).daily||[]).forEach(function(r){
      var d=new Date(r.date+'T12:00:00');
      if(d<b.from||d>b.to) return;
      t.spend+=n(r.spend);t.reach+=n(r.reach);t.impr+=n(r.impressions);
      t.clicks+=n(r.clicks);t.leads+=n(r.leads);t.regs+=n(r.registrations);
    });
  });
  return t;
}
function organic(){
  var d=periodDays(), w=(O.windows||{});
  var pick = d===null?'month' : d<=7?'7' : d<=14?'14' : d<=30?'30' : 'month';
  var x=w[pick]||{};
  return {ig:x.ig||{}, fb:x.fb||{}, window:pick};
}
function monthKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function stageGoal(k){return prorate(((S.stage_goals||{})[monthKey()]||{})[k]);}
function chanGoal(ch,k){return prorate((((S.channel_goals||{})[monthKey()]||{})[ch]||{})[k]);}
function lpConv(){var lpv=((C.ebook||{}).landing_page_views)||0,l=((C.ebook||{}).leads)||0;return lpv?(l/lpv*100):null;}
function chanLabel(k){var x=VIEWS.filter(function(v){return v.k===k})[0];return x?x.l:k;}

/* The five stages of the plan's funnel, in the plan's own language. */
function stages(){
  var p=paid(), o=organic(), yt=Y.channel||{};
  var mt=K.meeting||{}, wb=K.webinar||{}, rt=K.retention||{}, nu=K.nurture||{}, tf=K.tof||{};
  return [
    {id:'tof',name:'Top of funnel',sub:'Awareness and lead capture · paid + organic',
     actual:p.reach+n(o.ig.reach)+n(o.fb.page_views), goal:stageGoal('tof'), gkey:'tof',
     chans:{paid:p.reach,ig:n(o.ig.reach),fb:n(o.fb.page_views),yt:'alltime:'+n(yt.views)},
     kpis:[['Impressions',p.impr,''],['Clicks',p.clicks,''],['Ebook CTR',(C.ebook||{}).ctr,'%'],
           ['Cost per lead',(C.ebook||{}).cost_per_lead,'$'],
           ['TikTok views',tf.tiktok_views,''],['LinkedIn impressions',tf.linkedin_impressions,'']]},
    {id:'nurture',name:'Email nurture',sub:'Ebook captures, the sequence drives to the webinar',
     actual:p.leads, goal:stageGoal('nurture'), gkey:'nurture',
     chans:{paid:p.leads},
     kpis:[['Guide downloads',p.leads,''],['Landing page views',(C.ebook||{}).landing_page_views,''],
           ['Landing page conversion',lpConv(),'%'],['Guide delivery open',nu.guide_delivery_open,'%'],
           ['Broadcast open',nu.broadcast_open,'%'],['Broadcast click',nu.broadcast_click,'%'],
           ['Webinar invite click',nu.webinar_invite_click,'%']]},
    {id:'webinar',name:'Recorded webinar',sub:'The scalable closer for cold traffic',
     actual:p.regs, goal:stageGoal('webinar'), gkey:'webinar',
     chans:{paid:p.regs},
     kpis:[['Registered',p.regs,''],['Live attendees',wb.live_attendees,''],
           ['Apprentice sales from here',wb.apprentice_from_webinar,'']]},
    {id:'meeting',name:'Live relational meeting',sub:'2nd and 4th Wednesday · the warm-lead room',
     actual:(mt.registered===null||mt.registered===undefined)?null:n(mt.registered),
     goal:stageGoal('meeting'), gkey:'meeting', chans:{},
     kpis:[['Registered',mt.registered,''],['Participants',mt.participants,''],['Sales',mt.sales,'']]},
    {id:'retention',name:'Retention and outreach',sub:'Keep members in, re-engage the rest',
     actual:n(S.apprentice_total), goal:stageGoal('retention'), gkey:'retention', chans:{},
     kpis:[['Active members',rt.active_members,''],['Churned',rt.churned,''],
           ['Outreach contacts',rt.outreach_contacts,''],['Outreach converted',rt.outreach_converted,''],
           ['Protégé sales',n(S.protege_total),'']]}
  ];
}

function drill(s){
  var out='<div class="dsec">What we measure here</div>';
  out += s.kpis.map(function(k){
    var v=k[1],u=k[2],has=(v!==null&&v!==undefined);
    var shown = !has?'not tracked' : u==='$'?('$'+n(v).toFixed(2)) : u==='%'?(n(v).toFixed(1)+'%') : f(v);
    return '<div class="dch'+(has?'':' dim')+'"><div>'+k[0]+'</div><div class="v">'+shown+'</div><div class="g"></div></div>';
  }).join('');
  var chans=Object.keys(s.chans||{}).filter(function(c){return s.chans[c]!==null&&s.chans[c]!==undefined});
  if(chans.length){
    out+='<div class="dsec">By channel</div>'+chans.map(function(c){
      var v=s.chans[c],alltime=false;
      if(typeof v==='string'&&v.indexOf('alltime:')===0){alltime=true;v=+v.split(':')[1];}
      var cg=chanGoal(c,s.gkey);
      return '<div class="dch'+(alltime?' dim':'')+'"><div>'+chanLabel(c)+'</div><div class="v">'+f(v)+'</div>'
           + '<div class="g">'+(alltime?'all-time · needs owner access':(cg?'goal '+f(cg)+' · '+Math.round(v/cg*100)+'%':''))+'</div></div>';
    }).join('');
  }
  return out;
}


/* ---- Tactical channel view, same shape as the SE dashboard:
   what the channel is for, its live KPIs against goal, then a full table. ---- */
var CHANMETA={
  paid:{title:'Meta Paid',job:'Job: buy attention and turn it into guide downloads',ns:'Cost per lead'},
  ig:{title:'Instagram',job:'Job: awareness · Reels-led · @seanklangston.skillsup',ns:'Reach and non-follower reach'},
  fb:{title:'Facebook — Skills Up page',job:'Job: community proof and reach for the group',ns:'Page engagements'},
  yt:{title:'YouTube',job:'Job: long-form authority and Shorts reach',ns:'Monthly views'},
  email:{title:'Email — GetResponse',job:'Job: turn a download into a webinar registration',ns:'Webinar invite click rate'},
  outreach:{title:'Outreach',job:'Job: convert warm leads by talking to them',ns:'Contacts to conversion rate'}
};
function pctCls(a,t,lower){ if(a===null||t===null)return 'na';
  var r = lower? t/Math.max(a,0.01) : a/t; return r>=1?'ok':r>=0.6?'off':'no'; }
function pctTxt(a,t,lower){ if(a===null||a===undefined||!t)return '—';
  var r = lower? t/Math.max(a,0.01)*100 : a/t*100; return Math.round(r)+'%'; }

function channelView(){
  var host=g('chanview');
  if(ST.chan==='funnel'){ host.innerHTML=''; g('fn-head').style.display=''; return; }
  g('fn-head').style.display='';
  var m=CHANMETA[ST.chan]||{}, T=(S.channel_targets||{})[ST.chan]||{};
  var p=paid(), o=organic(), yt=Y.channel||{}, e=C.ebook||{}, K2=S.kpis||{};
  var rows=[];   // [label, actual, target, unit, lowerIsBetter]

  if(ST.chan==='paid'){
    var cpl=p.leads? p.spend/p.leads : null;
    rows=[['Spend',p.spend,T.spend,'$'],['Impressions',p.impr,T.impressions,''],
          ['Clicks',p.clicks,T.clicks,''],['CTR',p.impr?p.clicks/p.impr*100:null,T.ctr,'%'],
          ['Guide downloads',p.leads,T.leads,''],['Webinar registrations',p.regs,T.regs,''],
          ['Cost per lead',cpl,T.cpl,'$',true],
          ['Landing page views',e.landing_page_views,null,''],
          ['Landing page conversion',lpConv(),10,'%']];
  } else if(ST.chan==='ig'){
    var i=o.ig;
    rows=[['Reach',i.reach,T.reach,''],['Profile views',i.profile_views,T.profile_views,''],
          ['Followers',i.followers,null,''],['New followers',i.new_followers,T.new_followers,''],
          ['Engagement rate',i.engagement_rate,T.engagement_rate,'%'],
          ['Website clicks',i.website_clicks,T.website_clicks,'']];
  } else if(ST.chan==='fb'){
    var b=o.fb;
    rows=[['Page views',b.page_views,T.page_views,''],['Page engagements',b.page_engagements,T.page_engagements,''],
          ['Fans',b.fans,T.fans,'']];
  } else if(ST.chan==='yt'){
    rows=[['Subscribers',yt.subs,T.subs,''],['Total views (all-time)',yt.views,null,''],
          ['Videos published (all-time)',yt.videos,null,''],
          ['Views this month',null,T.views_month,''],['Uploads this month',null,T.uploads_month,'']];
  } else if(ST.chan==='email'){
    var nu=K2.nurture||{};
    rows=[['Guide delivery open',nu.guide_delivery_open,50,'%'],['Broadcast open',nu.broadcast_open,15,'%'],
          ['Broadcast click',nu.broadcast_click,3,'%'],['Webinar invite click',nu.webinar_invite_click,3,'%'],
          ['Guide downloads',p.leads,45,''],['Registrations driven',p.regs,30,'']];
  } else if(ST.chan==='outreach'){
    var rt=K2.retention||{}, mt=K2.meeting||{};
    rows=[['Contacts made',rt.outreach_contacts,40,''],['Converted',rt.outreach_converted,4,''],
          ['Meeting registered',mt.registered,12,''],['Meeting participants',mt.participants,8,''],
          ['Meeting sales',mt.sales,2,'']];
  }

  var live=rows.filter(function(r){return r[1]!==null&&r[1]!==undefined});
  var missing=rows.filter(function(r){return r[1]===null||r[1]===undefined});
  function shape(v,u){ return u==='$'?('$'+n(v).toFixed(2)) : u==='%'?(n(v).toFixed(1)+'%') : f(v); }

  var head='<div class="cvh"><h3>'+m.title+'</h3><div class="job">'+m.job+'</div>'
         + '<div class="ns">&#9733; North-star: '+m.ns+'</div></div>';

  var cards = live.slice(0,4).map(function(r){
    var cls=r[2]?pctCls(r[1],r[2],r[4]):'';
    return '<div class="c"><div class="k">'+r[0]+'</div><div class="v">'+shape(r[1],r[3])+'</div>'
         + '<div class="s '+cls+'">'+(r[2]?('goal '+shape(r[2],r[3])+' · <b>'+pctTxt(r[1],r[2],r[4])+'</b>'):'no goal set')+'</div></div>';
  }).join('');
  var kpis = cards? '<div class="cvk">'+cards+'</div>' : '';

  var table = live.length? '<table class="cvt"><thead><tr><th>Metric</th><th style="text-align:right">Actual</th>'
      + '<th style="text-align:right">Goal</th><th style="text-align:right">% to goal</th></tr></thead><tbody>'
      + live.map(function(r){
          return '<tr><td>'+r[0]+'</td><td class="n">'+shape(r[1],r[3])+'</td>'
               + '<td class="g">'+(r[2]?shape(r[2],r[3]):'—')+'</td>'
               + '<td class="st '+(r[2]?pctCls(r[1],r[2],r[4]):'na')+'">'+pctTxt(r[1],r[2],r[4])+'</td></tr>';
        }).join('') + '</tbody></table>' : '';

  var gap = missing.length? '<div class="gap" style="margin-top:12px"><b>Not tracked yet:</b> '
      + missing.map(function(r){return r[0]}).join(', ')
      + '. ' + (ST.chan==='email'?'GetResponse has an API, nothing is wired to it.'
              : ST.chan==='outreach'?'There is no log for this at all, so it is invisible in every view.'
              : ST.chan==='yt'?'Needs channel-owner authorization; manager access will not return it.'
              : 'Needs a manual export.') + '</div>' : '';

  host.innerHTML='<div class="cv">'+head+kpis+table+gap+'</div>';
}

function render(){
  g('stamp').textContent='Funnel · '+(D.last_updated||'');
  g('seg-range').innerHTML=RANGES.map(function(r){return '<button data-r="'+r.k+'" class="'+(ST.range===r.k?'on':'')+'">'+r.l+'</button>'}).join('');
  g('seg-chan').innerHTML=VIEWS.map(function(v){return '<button data-c="'+v.k+'" class="'+(ST.chan===v.k?'on':'')+'">'+v.l+'</button>'}).join('');
  g('custom').className='custom'+(ST.range==='custom'?' on':'');
  g('seg-range').onclick=function(e){if(e.target.dataset.r){ST.range=e.target.dataset.r;render();}};
  g('seg-chan').onclick=function(e){if(e.target.dataset.c){ST.chan=e.target.dataset.c;render();}};
  g('d-from').onchange=function(){ST.from=this.value;ST.range='custom';render();};
  g('d-to').onchange=function(){ST.to=this.value;ST.range='custom';render();};

  var st=stages(),html='',prev=null;
  st.forEach(function(s){
    var actual=s.actual, goal=s.goal;
    if(ST.chan!=='funnel'){
      var v=(s.chans||{})[ST.chan];
      if(typeof v==='string'&&v.indexOf('alltime:')===0) v=+v.split(':')[1];
      actual=(v===undefined||v===null)?null:v;
      goal=chanGoal(ST.chan,s.gkey);
    }
    if(prev!==null&&prev>0&&actual!==null){
      var pc=actual/prev*100;
      html+='<div class="step'+(pc<5?' bad':'')+'"><b>'+(pc>=10?pc.toFixed(0):pc.toFixed(1))+'%</b> carried through</div>';
    }
    var pct='—',cls='na';
    if(actual===null) pct='not attributed';
    else if(goal){var r=actual/goal*100;cls=r>=100?'ok':r>=60?'off':'no';pct=Math.round(r)+'%';}
    html+='<div class="fr'+(ST.open===s.id?' open':'')+'" data-s="'+s.id+'">'
        + '<div class="caret">&#9654;</div><div class="name">'+s.name+'<small>'+s.sub+'</small></div>'
        + '<div class="num'+(actual===null?' na':'')+'">'+(actual===null?'n/a':f(actual))+'</div>'
        + '<div class="goal">'+(goal?'goal '+f(goal):'')+'</div>'
        + '<div class="pct '+cls+'">'+pct+'</div></div>'
        + '<div class="drill'+(ST.open===s.id?' on':'')+'" data-d="'+s.id+'">'+drill(s)+'</div>';
    if(actual!==null) prev=actual;
  });
  g('funnel').innerHTML=html;
  g('funnel').onclick=function(e){var r=e.target.closest('.fr');if(!r)return;
    ST.open=ST.open===r.dataset.s?null:r.dataset.s;render();};

  channelView(); economics(); okrs();
  var o=organic();
  g('foot-note').textContent='Paid answers the date filter exactly. Organic snaps to Meta’s nearest window ('
    +o.window+'d). Goals are monthly, pro-rated to the period shown. Sales, email and meeting figures are entered by hand, last updated '
    +(S._submitted_at? (S._submitted_at.slice(0,10)+' by '+(S._submitted_by||'someone')) : (S.last_updated||'—'))+'.';
}

function economics(){
  var p=paid(),appr=n(S.apprentice_total),prot=n(S.protege_total),cust=appr+prot;
  var ltv=8.99*ST.retention+(ST.ascension/100)*2499;
  var cac=cust?p.spend/cust:0;
  g('econ').innerHTML=
     '<div class="e"><div class="k">Spend</div><div class="v">'+money(p.spend)+'</div><div class="s">'+chanLabel(ST.chan)+'</div></div>'
   + '<div class="e"><div class="k">CAC</div><div class="v">'+(cust?money(cac):'—')+'</div><div class="s">'+cust+' customer'+(cust===1?'':'s')+'</div></div>'
   + '<div class="e"><div class="k">LTV</div><div class="v">'+money(ltv)+'</div><div class="s">blended per member</div></div>'
   + '<div class="e"><div class="k">LTV : CAC</div><div class="v">'+(cac?(ltv/cac).toFixed(2)+'x':'—')+'</div><div class="s">target 3x</div></div>'
   + '<div class="e"><div class="k">Payback</div><div class="v">'+(cac?Math.round(cac/8.99)+' mo':'—')+'</div><div class="s">on $8.99 a month</div></div>';
  g('assump').innerHTML='Assuming a member stays <input id="a-ret" type="number" min="1" max="60" value="'+ST.retention+'"> months and '
    +'<input id="a-asc" type="number" min="0" max="100" value="'+ST.ascension+'">% go on to Prot&eacute;g&eacute;. Neither is measured yet.';
  g('a-ret').oninput=function(){ST.retention=Math.max(1,+this.value||12);render();};
  g('a-asc').oninput=function(){ST.ascension=Math.max(0,+this.value||0);render();};
}

function okrs(){
  var r=ST.range,fr=ST.from,t2=ST.to; ST.range='all'; var all=paid(); ST.range=r;ST.from=fr;ST.to=t2;
  var e=C.ebook||{},appr=n(S.apprentice_total);
  var ed=(e.daily||[]);
  var eLeads=ed.reduce(function(a,x){return a+n(x.leads)},0);
  var eSpend=ed.reduce(function(a,x){return a+n(x.spend)},0);
  var cpl=eLeads?eSpend/eLeads:null;
  var cust=appr+n(S.protege_total);
  var ltv=8.99*ST.retention+(ST.ascension/100)*2499;
  var cac=cust?all.spend/cust:null;
  var mt=K.meeting||{},nu=K.nurture||{},rt=K.retention||{},tf=K.tof||{};
  var data=[
    ['O1','Make the funnel a predictable engine',[
      {n:'Ebook leads per month',a:eLeads,t:60},
      {n:'Cost per lead',a:cpl,t:25,fmt:'$',lower:true},
      {n:'Landing page conversion',a:lpConv(),t:10,fmt:'%'},
      {n:'Apprentice signups',a:appr,t:4}]],
    ['O2','Grow the webinar and meeting pipeline',[
      {n:'Webinar registrations',a:all.regs,t:40},
      {n:'Registration to Apprentice',a:all.regs?appr/all.regs*100:null,t:10,fmt:'%'},
      {n:'Meeting participants',a:mt.participants,t:12}]],
    ['O3','Rebuild reach, lead with what works',[
      {n:'YouTube views per month',a:null,t:3500,why:'needs owner access'},
      {n:'Instagram reach',a:n((organic().ig||{}).reach),t:3000},
      {n:'TikTok views',a:tf.tiktok_views,t:12000,why:'manual export'}]],
    ['O4','Prove the unit economics',[
      {n:'LTV to CAC ratio',a:cac?ltv/cac:null,t:3,fmt:'x'},
      {n:'Email open rate',a:nu.broadcast_open,t:15,fmt:'%',why:'from GetResponse'},
      {n:'Warm-lead outreach logged',a:rt.outreach_contacts,t:40,why:'Rodney'}]]
  ];
  function sh(v,fmt){if(v===null||v===undefined)return '—';
    return fmt==='$'?'$'+n(v).toFixed(2):fmt==='%'?n(v).toFixed(1)+'%':fmt==='x'?n(v).toFixed(2)+'x':f(v);}
  g('okrs').innerHTML=data.map(function(o){
    return '<div class="o"><div class="t"><span>'+o[0]+'</span>'+o[1]+'</div>'
      + o[2].map(function(k){
          if(k.a===null||k.a===undefined)
            return '<div class="kr"><div>'+k.n+'</div><div class="kv">— <s>/ '+sh(k.t,k.fmt)+'</s></div>'
                 + '<div class="bar"></div><div class="p na">'+(k.why||'not tracked')+'</div></div>';
          var pc=k.lower?Math.min(100,k.t/Math.max(k.a,.01)*100):Math.min(100,k.a/k.t*100);
          var cls=pc>=100?'':pc>=60?'off':'no';
          return '<div class="kr"><div>'+k.n+'</div>'
               + '<div class="kv"><b>'+sh(k.a,k.fmt)+'</b> / '+sh(k.t,k.fmt)+'</div>'
               + '<div class="bar"><i class="'+cls+'" style="width:'+pc+'%"></i></div>'
               + '<div class="p">'+Math.round(pc)+'%</div></div>';
        }).join('') + '</div>';
  }).join('');
}
fetch('https://rifa-mae-default-rtdb.firebaseio.com/skles-ops/metrics.json')
  .then(function(r){return r.ok?r.json():null})
  .then(function(m){ applySubmitted(m); render(); })
  .catch(function(){ render(); });
render();
})();
</script>
