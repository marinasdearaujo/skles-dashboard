<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKLES Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Montserrat:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#0F1F3A; --deep:#081428; --card:#16294A; --line:#2A3D63;
  --ink:#E8ECF5; --dim:#8FA0C0; --gold:#E0C58F;
  --red:#F2857C; --amber:#E0B451; --green:#5BC48E;
  --f-head:'Montserrat',system-ui,sans-serif; --f-body:'Roboto',system-ui,sans-serif;
  --f-mono:'Roboto Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--f-body);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 70px}
h1,h2{font-family:var(--f-head);margin:0}
h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
.stamp{font-family:var(--f-mono);font-size:11.5px;color:var(--dim)}

.ctx{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);margin:16px 0 11px}
.ctx b{color:var(--ink);font-weight:500}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:30px}
.num{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px 10px;
  border-top:3px solid var(--line);min-width:0}
.num.good{border-top-color:var(--green)} .num.warn{border-top-color:var(--amber)}
.num.bad{border-top-color:var(--red)} .num.early{border-top-color:#5E6F90}
.num .v{font-family:var(--f-head);font-size:20px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.num .l{font-size:10.5px;color:var(--ink);margin-top:4px;line-height:1.3}
.num .t{font-family:var(--f-mono);font-size:9.5px;margin-top:7px;padding-top:6px;
  border-top:1px solid var(--line);line-height:1.35}
.num.good .t{color:var(--green)} .num.warn .t{color:var(--amber)}
.num.bad .t{color:var(--red)} .num.early .t{color:#8FA0C0}
.num .w{font-size:9.5px;color:#5E6F90;margin-top:3px;line-height:1.3}
@media(max-width:1180px){.nums{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.nums{grid-template-columns:repeat(2,1fr)}}

/* ---- worklist ---- */
.act{display:grid;grid-template-columns:4px 1fr;gap:0;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;margin-bottom:9px;overflow:hidden}
.act .bar{background:var(--dim)}
.act.red .bar{background:var(--red)} .act.amber .bar{background:var(--amber)}
.act .body{padding:15px 18px}
.act .t{font-family:var(--f-head);font-weight:600;font-size:15px;margin-bottom:5px}
.act .why{color:var(--dim);font-size:13px;margin-bottom:11px;max-width:74ch}
.act .do{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.act .do b{color:var(--gold);font-weight:600;font-family:var(--f-head);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase}
.who{font-family:var(--f-mono);font-size:11px;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-left:auto}
.rule{font-family:var(--f-mono);font-size:10.5px;color:#5E6F90;margin-top:9px}
.clear{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--green);
  border-radius:9px;padding:17px 19px;color:var(--dim)}
.clear b{color:var(--green);font-family:var(--f-head)}

/* ---- statement ---- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 12px}
.chip{font-family:var(--f-head);font-size:11px;font-weight:600;letter-spacing:.05em;
  padding:6px 13px;border:1px solid var(--line);border-radius:20px;color:var(--dim);
  background:transparent;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--deep)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
.when{font-family:var(--f-mono);font-size:11.5px;color:var(--dim);white-space:nowrap}
.kind{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 7px;border-radius:4px;white-space:nowrap}
.kind.ads{color:var(--gold);background:rgba(224,197,143,.12)}
.kind.lead{color:var(--green);background:rgba(91,196,142,.13)}
.kind.open{color:#8FB8E8;background:rgba(143,184,232,.13)}
.kind.click{color:var(--amber);background:rgba(224,180,81,.14)}
.detail{color:var(--dim);font-size:12px}
.tablewrap{background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden}
footer{margin-top:34px;font-family:var(--f-mono);font-size:11px;color:#5E6F90}

/* ---- funnel views ---- */
.vtabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:14px 0 0}
.vtab{font-family:var(--f-head);font-size:11.5px;font-weight:600;letter-spacing:.05em;
  padding:10px 16px;border:none;border-bottom:2px solid transparent;color:var(--dim);
  background:transparent;cursor:pointer;margin-bottom:-1px}
.vtab.on{color:var(--gold);border-bottom-color:var(--gold)}
.vq{font-size:12.5px;color:var(--dim);margin:12px 0 14px;font-style:italic}
.fn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 10px}
.fn-row{width:100%;display:flex;flex-direction:column;align-items:center}
.fn-bar{border-radius:5px;padding:11px 18px;text-align:center;min-width:112px;
  background:var(--card);border:1px solid var(--line);border-top:3px solid var(--dim);
  transition:width .25s ease}
.fn-bar.good{border-top-color:var(--green)} .fn-bar.warn{border-top-color:var(--amber)}
.fn-bar.bad{border-top-color:var(--red)}
.fn-bar .n{font-family:var(--f-head);font-weight:700;font-size:22px;line-height:1.05;
  font-variant-numeric:tabular-nums}
.fn-bar .nm{font-size:11.5px;color:var(--dim);margin-top:4px;letter-spacing:.03em}
.fn-gap{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:11px;
  color:var(--dim);padding:2px 0}
.fn-gap b{font-family:var(--f-head);font-size:13px;font-weight:700}
.fn-gap b.good{color:var(--green)} .fn-gap b.warn{color:var(--amber)} .fn-gap b.bad{color:var(--red)}
.fn-gap .bm{color:#5E6F90}
.fn-fix{font-size:11.5px;color:var(--amber);margin-top:5px;max-width:46ch;line-height:1.4}
.fn-fix b{font-family:var(--f-head);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--amber);display:block;margin-bottom:1px}
.sank{width:100%;height:auto;display:block}
.sank text{font-family:'Roboto',sans-serif;font-size:11px;fill:#E8ECF5}
.sank text.sm{font-size:9.5px;fill:#8FA0C0}
.sank text.hd{font-family:'Montserrat',sans-serif;font-size:10px;fill:#8FA0C0;
  letter-spacing:.1em;text-transform:uppercase}
.grid-t td,.grid-t th{text-align:center;padding:8px 6px}
.grid-t td:first-child,.grid-t th:first-child{text-align:left;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green)}
.dot.off{background:#24324E}
@media(max-width:640px){ .hide-s{display:none} .wrap{padding:20px 14px 60px} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>SKLES Today</h1>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="stamp">what to do &middot; what happened</div>
</header>

<div class="ctx" id="ctx"></div>
<div class="nums" id="nums"></div>

<h2>Do now</h2>
<div id="actions" style="margin-top:12px"></div>


<h2 style="margin-top:34px">The funnel</h2>
<div class="vtabs" id="vtabs"></div>
<div class="vq" id="vq"></div>
<div id="vbody"></div>

<h2 style="margin-top:34px">Statement</h2>
<div class="chips" id="chips"></div>
<div class="tablewrap">
  <table>
    <thead><tr><th>When</th><th>What</th><th class="hide-s">Detail</th></tr></thead>
    <tbody id="events"></tbody>
  </table>
</div>

<footer id="foot"></footer>

</div>

<script src="skles-today-data.js"></script>
<script>
(function () {
  var D = window.SKLES_TODAY;
  var $ = function (id) { return document.getElementById(id); };
  if (!D) { $('actions').textContent = 'No data. Run skles_today_pull.py'; return; }

  $('stamp').textContent = D.generated;
  var c = D.counts || {};
  $('ctx').innerHTML = '<b>' + c.leads + '</b> on the list &middot; <b>$' +
    (c.spend7 || 0).toFixed(0) + '</b> spent in 7 days &middot; <b>' + c.sends +
    '</b> emails sent &middot; <b>' + (D.seen_price || 0) + '</b> have seen the price';

  var VERD = {good:'on target', warn:'under target', bad:'off target', early:'too early to judge', none:''};
  $('nums').innerHTML = (D.scores || []).map(function (x) {
    return '<div class="num ' + x.s + '">' +
      '<div class="v">' + x.v + '</div>' +
      '<div class="l">' + x.k + '</div>' +
      '<div class="t">' + VERD[x.s] + (x.t && x.s !== 'early' ? ' &middot; want ' + x.t : '') + '</div>' +
      '<div class="w">' + x.why + '</div></div>';
  }).join('');

  var A = D.actions || [];
  $('actions').innerHTML = A.length ? A.map(function (a) {
    return '<div class="act ' + a.sev + '"><div class="bar"></div><div class="body">' +
      '<div class="t">' + a.title + '</div>' +
      '<div class="why">' + a.why + '</div>' +
      '<div class="do"><b>Next</b><span>' + a.step + '</span>' +
        '<span class="who">' + a.who + '</span></div>' +
      '<div class="rule">fired by: ' + a.rule + '</div>' +
    '</div></div>';
  }).join('') : '<div class="clear"><b>Nothing needs you.</b> ' +
      'No rule fired. The statement below still shows what moved.</div>';


  /* ---- the funnel, three views ---- */
  var VIEWS = [
    {k:'leak',   label:'Where it leaks',  q:'Which step is abnormal, measured against what this kind of funnel normally does.'},
    {k:'cohort', label:'By cohort',       q:'Is the funnel getting better. Each row is the week people arrived, so a change shows up as a better row, not a better average.'},
    {k:'people', label:'Person by person',q:'Who is stuck and where. At this volume an average of thirteen people hides more than it shows.'},
    {k:'journey',label:'Journey',          q:'Where each person came from and how they branched, including the ones who went nowhere.'}
  ];
  var view = 'people';

  $('vtabs').innerHTML = VIEWS.map(function (v) {
    return '<button class="vtab' + (v.k === view ? ' on' : '') + '" data-v="' + v.k + '">' + v.label + '</button>';
  }).join('');

  function drawView() {
    var v = VIEWS.filter(function (x) { return x.k === view; })[0];
    $('vq').textContent = v.q;

    if (view === 'leak') {
      var L = D.leak || [];
      var max = Math.max.apply(null, L.map(function (x) { return x.n; }).concat([1]));
      // power curve so the narrow end stays readable while the shape still narrows
      var w = function (n) { return Math.max(11, Math.pow((n || 0) / max, 0.34) * 100); };
      var html = '<div class="fn">';
      L.forEach(function (l, i) {
        if (i > 0) {
          var bm = l.lo ? 'normally ' + l.lo + ' to ' + l.hi + '%' : '';
          html += '<div class="fn-gap"><b class="' + l.verdict + '">' +
            (l.rate === null ? '&mdash;' : l.rate + '%') + '</b>' +
            '<span>of the step above</span>' +
            (bm ? '<span class="bm">&middot; ' + bm + '</span>' : '') + '</div>';
        }
        html += '<div class="fn-row"><div class="fn-bar ' + l.verdict +
          '" style="width:' + w(l.n).toFixed(1) + '%">' +
          '<div class="n">' + l.n.toLocaleString('en-US') + '</div>' +
          '<div class="nm">' + l.k + '</div>' +
          (l.lever ? '<div class="fn-fix"><b>fix this</b>' + l.lever + '</div>' : '') +
          '</div></div>';
      });
      $('vbody').innerHTML = html + '</div>';
      return;
    }

    if (view === 'cohort') {
      var st = (D.steps || []).slice(1);
      $('vbody').innerHTML = '<div class="tablewrap"><table class="grid-t"><thead><tr>' +
        '<th>Week they arrived</th><th>Leads</th>' + st.map(function (x) { return '<th>' + x + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        (D.cohorts || []).map(function (c) {
          return '<tr><td>' + c.week + '</td><td><b>' + c.n + '</b></td>' +
            st.map(function (x) {
              var n = c[x] || 0, pc = c.n ? Math.round(n / c.n * 100) : 0;
              return '<td>' + n + (n ? ' <span class="detail">' + pc + '%</span>' : '') + '</td>';
            }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      return;
    }


    if (view === 'journey') {
      var J = D.journey || {cols:[],links:[]};
      var W = 860, PAD = 26, NW = 132, H = 300, GAP = 7;
      var colX = J.cols.map(function (_, i) {
        return PAD + i * ((W - PAD * 2 - NW) / Math.max(1, J.cols.length - 1));
      });
      var total = J.cols[0] ? J.cols[0].nodes.reduce(function (a, n) { return a + n.n; }, 0) : 1;
      var unit = (H - PAD - GAP * 4) / Math.max(1, total);
      var pos = {};
      J.cols.forEach(function (col, ci) {
        var y = PAD;
        col.nodes.forEach(function (nd) {
          var h = Math.max(13, nd.n * unit);
          pos[nd.k] = {x: colX[ci], y: y, h: h, n: nd.n, col: ci, cur: y};
          y += h + GAP;
        });
      });
      var COLOR = ['#E0C58F', '#5BC48E', '#8FB8E8', '#E0B451', '#F2857C', '#9B8FD8'];
      var ribbons = '', idx = 0;
      (J.links || []).forEach(function (l) {
        var a = pos[l.from], b = pos[l.to];
        if (!a || !b) return;
        var ah = l.n * unit, bh = l.n * unit;
        var x1 = a.x + NW, x2 = b.x, mid = (x1 + x2) / 2;
        var y1 = a.cur, y2 = b.cur;
        a.cur += ah; b.cur += bh;
        ribbons += '<path d="M' + x1 + ',' + y1 + ' C' + mid + ',' + y1 + ' ' + mid + ',' + y2 +
          ' ' + x2 + ',' + y2 + ' L' + x2 + ',' + (y2 + bh) + ' C' + mid + ',' + (y2 + bh) +
          ' ' + mid + ',' + (y1 + ah) + ' ' + x1 + ',' + (y1 + ah) + ' Z" fill="' +
          COLOR[idx++ % COLOR.length] + '" opacity=".3"/>';
      });
      var nodes = '', heads = '';
      J.cols.forEach(function (col, ci) {
        heads += '<text class="hd" x="' + colX[ci] + '" y="14">' + col.name + '</text>';
        col.nodes.forEach(function (nd) {
          var p = pos[nd.k];
          nodes += '<rect x="' + p.x + '" y="' + p.y + '" width="' + NW + '" height="' + p.h +
            '" rx="3" fill="#16294A" stroke="#2A3D63"/>' +
            '<text x="' + (p.x + 8) + '" y="' + (p.y + 15) + '">' + nd.n + '</text>' +
            '<text class="sm" x="' + (p.x + 8) + '" y="' + (p.y + 27) + '">' +
            (nd.k.length > 19 ? nd.k.slice(0, 18) + '…' : nd.k) + '</text>';
        });
      });
      $('vbody').innerHTML = '<div class="tablewrap" style="padding:8px">' +
        '<svg class="sank" viewBox="0 0 ' + W + ' ' + (H + 10) + '">' +
        ribbons + nodes + heads + '</svg></div>';
      return;
    }

    var steps = D.steps || [];
    $('vbody').innerHTML = '<div class="tablewrap"><table class="grid-t"><thead><tr>' +
      '<th>Lead</th>' + steps.map(function (x) { return '<th>' + x + '</th>'; }).join('') +
      '<th>Since</th></tr></thead><tbody>' +
      (D.people || []).map(function (p) {
        return '<tr><td>' + p.name + '</td>' +
          steps.map(function (x) {
            return '<td><span class="dot' + (p.reached[x] ? '' : ' off') + '"></span></td>';
          }).join('') +
          '<td class="detail">' + (p.first_touch || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  $('vtabs').addEventListener('click', function (e) {
    var b = e.target.closest('.vtab'); if (!b) return;
    view = b.dataset.v;
    [].forEach.call(document.querySelectorAll('.vtab'), function (x) { x.classList.toggle('on', x === b); });
    drawView();
  });
  drawView();

  var E = D.events || [], filter = 'all';
  var kinds = ['all'].concat(Object.keys(E.reduce(function (m, e) { m[e.kind] = 1; return m; }, {})));
  $('chips').innerHTML = kinds.map(function (k) {
    return '<button class="chip' + (k === 'all' ? ' on' : '') + '" data-k="' + k + '">' +
      (k === 'all' ? 'everything' : k) + '</button>';
  }).join('');

  function draw() {
    var rows = E.filter(function (e) { return filter === 'all' || e.kind === filter; });
    $('events').innerHTML = rows.length ? rows.map(function (e) {
      return '<tr><td class="when">' + e.when.replace('T', '  ') + '</td>' +
        '<td><span class="kind ' + e.kind + '">' + e.kind + '</span> ' + e.what + '</td>' +
        '<td class="detail hide-s">' + (e.detail || '') + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="detail">Nothing of that kind.</td></tr>';
    $('foot').textContent = rows.length + ' of ' + E.length + ' events shown';
  }
  $('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (!b) return;
    filter = b.dataset.k;
    [].forEach.call(document.querySelectorAll('.chip'), function (x) { x.classList.toggle('on', x === b); });
    draw();
  });
  draw();
})();
</script>
</body>
</html>
