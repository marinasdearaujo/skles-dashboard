<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monthly review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap">
<style>
:root{
  --navy:#112250; --gold:#E0C58F; --ink:#16181d; --muted:#5d6472;
  --bg:#faf9f7; --card:#fff; --line:#e4e2dd; --wash:#f2f0ec; --grid:#d9d6d0; --head:#eceae5;
  --good:#1f7a4d; --bad:#b4344a;
  --sans:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:'Merriweather',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--navy)}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--gold)}
select,input,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--grid);border-radius:7px;padding:8px 11px}
textarea{width:100%;min-height:86px;resize:vertical;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
#err{display:none;background:#fdeef1;border:1px solid var(--bad);color:var(--bad);
  border-radius:6px;padding:9px 12px;font-size:12.5px}
.state{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);
  background:var(--wash);border-radius:20px;padding:2px 8px}
.state.in{background:#e7f2ec;color:var(--good)}
.ux{position:fixed;right:12px;bottom:12px;z-index:90;background:var(--navy);color:#fff;
  font-size:11.5px;font-weight:600;text-decoration:none;padding:9px 13px;border-radius:30px;
  box-shadow:0 6px 18px rgba(17,34,80,.28)}

:root{
  --bg:#f4f6fb; --card:#fff; --line:#e6eaf3; --grid:#dfe4ef; --wash:#eef1f8;
  --navy:#1b2b58; --gold:#c79a3f; --ink:#171b26; --muted:#6b7490;
  --good:#17805a; --bad:#c13b52;
  --lift:0 1px 2px rgba(23,35,70,.06),0 8px 22px rgba(23,35,70,.07);
  --lift-sm:0 1px 2px rgba(23,35,70,.05),0 5px 14px rgba(23,35,70,.05);
  --deep:linear-gradient(140deg,#24376d,#16224a);
}
.t-paid{background:linear-gradient(180deg,#eefaf4,#fff 42%)}
.t-social{background:linear-gradient(180deg,#fdf6e7,#fff 42%)}
.t-uploads{background:linear-gradient(180deg,#f1f3f8,#fff 42%)}
.t-youtube{background:linear-gradient(180deg,#fdeef2,#fff 42%)}
.t-funnel{background:linear-gradient(180deg,#eef2fd,#fff 42%)}
select,input,textarea{border-radius:11px;border-color:var(--grid);box-shadow:var(--lift-sm);border:0}
.pill{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--navy);background:var(--card);
  border:0;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:var(--lift-sm);
  transition:.14s}
.pill:hover{box-shadow:var(--lift)}
.pill[aria-current=true],.pill.on{background:var(--deep);color:#fff}
.pill[disabled]{opacity:.4;cursor:default;box-shadow:none}
.state{border-radius:999px;background:var(--wash)}
.state.in{background:#e3f4ec;color:var(--good)}
#err{border-radius:12px;border:0;box-shadow:var(--lift-sm);background:#fdeef1}
.ux{background:var(--deep)}

.card{background:var(--card);border-radius:16px;box-shadow:var(--lift);padding:19px 21px}
.card.sm{border-radius:14px;box-shadow:var(--lift-sm);padding:15px 17px}
.hero{display:flex;align-items:flex-end;gap:13px;padding-bottom:15px;margin-bottom:15px;
  border-bottom:1px solid rgba(23,35,70,.08)}
.hero b{font-size:40px;font-weight:700;line-height:.95;color:var(--navy);
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hero b.good{color:var(--good)} .hero b.bad{color:var(--bad)}
.hero span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--muted);padding-bottom:6px}
.mrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:8px 0;
  border-bottom:1px solid rgba(23,35,70,.06);font-size:13.5px}
.mrow:last-child{border-bottom:0}
.mrow span{color:var(--muted)}
.mrow b{font-weight:600;font-variant-numeric:tabular-nums}
.mrow b.good{color:var(--good)} .mrow b.bad{color:var(--bad)}
.verdict{font-size:13.5px;line-height:1.6;margin-top:16px;background:var(--wash);
  border-radius:12px;padding:13px 15px;color:var(--ink)}
.verdict:before{content:'';display:block;width:26px;height:3px;border-radius:3px;
  background:var(--gold);margin-bottom:9px}
.rl{background:var(--card);border-radius:14px;box-shadow:var(--lift-sm);padding:13px 15px;
  margin-bottom:8px}
.rl .rule{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--gold)}
.rl p{font-size:13.5px;margin-top:4px}
.d{background:var(--deep);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:9px;
  box-shadow:var(--lift)}
.d h3{font-size:14px;color:#fff}
.d h3 em{font-style:normal;color:var(--gold);font-weight:400;font-size:11.5px}
.d p{font-size:13.5px;color:#d6dcee;margin-top:5px}
.box{background:var(--card);border-radius:14px;box-shadow:var(--lift-sm);padding:15px 17px;
  margin-bottom:10px}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.bh h3{font-size:14px;color:var(--navy)}
.bh .role{font-size:11.5px;color:var(--muted);flex:1}
.plan a{font-size:15.5px;font-weight:700}
.url{width:100%;max-width:420px;margin-top:11px}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px}
.sheet{background:var(--card);border-radius:14px;box-shadow:var(--lift-sm);overflow-x:auto;
  padding:4px 16px 8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:480px}
th{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  padding:12px 12px 8px 0;border-bottom:1px solid rgba(23,35,70,.1)}
td{padding:9px 12px 9px 0;border-bottom:1px solid rgba(23,35,70,.06);
  font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

.wrap{max-width:1220px;margin:0 auto;padding:0 18px 80px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:22px 4px}
.bar h1{font-size:clamp(21px,3.4vw,27px);font-weight:700;color:var(--navy);letter-spacing:-.025em;
  white-space:nowrap}
.bar .sub{font-size:11.5px;color:var(--muted);flex:1}
.spine{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:12px 14px;
  margin-top:8px}
.track{height:5px;border-radius:5px;background:var(--card);box-shadow:var(--lift-sm);
  overflow:hidden;margin-bottom:9px}
.track i{display:block;height:100%;border-radius:5px;background:var(--gold);transition:width .3s}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sp{text-align:left;font-family:inherit;border:0;cursor:pointer;background:var(--card);
  border-radius:13px;box-shadow:var(--lift-sm);padding:10px 13px;display:grid;gap:2px;
  transition:.14s;color:inherit}
.sp:hover{box-shadow:var(--lift)}
.sp[data-state=now]{background:var(--deep);box-shadow:0 8px 22px rgba(23,35,70,.2)}
.sp .when{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.sp .nm{font-size:13px;font-weight:600;color:var(--navy);line-height:1.25}
.sp[data-state=now] .nm{color:#fff}
.sp[data-state=done] .nm{color:var(--muted)}
.sh{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.sh h2{font-size:clamp(19px,3vw,24px);font-weight:700;color:var(--navy);letter-spacing:-.025em}
.sh .who{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;
  color:var(--muted)}
.task{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:70ch;margin-bottom:16px}
.two{display:grid;grid-template-columns:286px minmax(0,1fr);gap:16px;align-items:start}
.list{display:grid;gap:8px;align-content:start;position:sticky;top:112px}
.lh{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:var(--muted);padding:2px 4px 1px}
.it{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;text-align:left;
  font-family:inherit;border:0;cursor:pointer;background:var(--card);border-radius:13px;
  box-shadow:var(--lift-sm);padding:12px 14px;transition:.14s;color:inherit}
.it:hover{box-shadow:var(--lift);transform:translateY(-1px)}
.it[aria-current=true]{background:var(--deep);box-shadow:0 8px 22px rgba(23,35,70,.2)}
.it .nm{font-size:13px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:7px}
.it[aria-current=true] .nm{color:#fff}
.it .fig{font-size:14.5px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap}
.it[aria-current=true] .fig{color:var(--gold)}
.it .sb{font-size:10.5px;color:var(--muted);grid-column:1/-1;line-height:1.3}
.it[aria-current=true] .sb{color:#b9c3dd}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grid);flex:none}
.dot.good{background:var(--good)} .dot.bad{background:var(--bad)}
.it[aria-current=true] .dot.good{background:#6fe0ad} .it[aria-current=true] .dot.bad{background:#ff9fb0}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fh h3{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:700;flex:1}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;
  margin-bottom:14px}
.kp{background:var(--card);border-radius:13px;box-shadow:var(--lift-sm);padding:10px 13px}
.kp b{display:block;font-size:18px;font-weight:700;color:var(--navy);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kp b.good{color:var(--good)} .kp b.bad{color:var(--bad)}
.kp span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;display:block;margin-top:3px}
.nav{display:flex;gap:9px;margin-top:22px;align-items:center}
.nav .of{font-size:11.5px;color:var(--muted);margin-left:auto}
.wide{max-width:780px}
@media(max-width:820px){.two{grid-template-columns:1fr}.list{position:static}
  .steps{grid-template-columns:repeat(2,1fr);gap:7px}.spine{position:static}}

</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div><div class="eyebrow">Skills&nbsp;Up &middot; Sean K. Langston</div>
      <h1 id="title">Monthly review</h1></div>
    <span class="sub" id="built"></span>
    <select id="pick" class="pill" aria-label="Which month"></select>
  </div>
  <div id="err" style="margin-top:12px">Cannot reach the sheet just now. Nothing typed will save
    until the connection is back.</div>
  <div class="spine">
    <div class="track"><i id="fill"></i></div>
    <div class="steps" id="steps"></div>
  </div>
  <div id="stage"></div>
  <div class="nav">
    <button class="pill" id="prev">&larr; Back</button>
    <button class="pill on" id="next">Next &rarr;</button>
    <span class="of" id="of"></span>
  </div>
  <p class="hint">How content gets made: <a href="content-pipeline.html">the pipeline</a> &middot;
    this month's cards: <a href="ops-board.html">ops board</a>.</p>
</div>

<a class="ux" href="review-pick.html">&larr; the other four</a>
<script>

const FB='https://rifa-mae-default-rtdb.firebaseio.com/skles-ops/review';
const MONTHS=['January','February','March','April','May','June','July','August',
  'September','October','November','December'];
const CPLB=18.5;
let ALL={},CUR=null;

const fail=()=>{const e=document.getElementById('err');if(e)e.style.display='block';};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=m=>{const p=m.split('-');return MONTHS[+p[1]-1]+' '+p[0];};
const num=v=>(v==null?'—':Number(v).toLocaleString('en-GB'));
const money=v=>(v==null?'—':'$'+Number(v||0).toFixed(2));

/* One normalised shape, five layouts. Nothing below here knows how it will be drawn. */
function model(d){
  d=d||{};
  const f=d.fronts||{};
  const paid=(f.paid&&f.paid.data)||null;
  const soc=(f.social&&f.social.data)||{},ig=soc.ig,fb=soc.fb,bd=soc.board||{},st=bd.by_status||{};
  const up=(f.uploads&&f.uploads.data)||{},fbp=up['facebook-sean']||{},
        li=up.linkedin||{},tk=up.tiktok||{},tot=fbp.totals||{};
  const yt=(f.youtube&&f.youtube.data)||{},rec=yt.recent||[];
  const fn=(f.funnel&&f.funnel.data)||{},lc=fn.lifecycle||{};
  const top=rec.reduce((a,v)=>(v.views||0)>((a&&a.views)||0)?v:a,null);
  const F=[];

  F.push({key:'paid',label:'Paid',note:'Meta ads, pulled every three hours',
    head:paid&&paid.cpl?money(paid.cpl):'—',headsub:'cost per lead',
    tone:paid&&paid.cpl&&paid.cpl<CPLB?'good':'bad',
    quick:[['Spend',money(paid&&paid.spend)],['Leads',num(paid&&paid.leads)]],
    metrics:paid?[['Spend',money(paid.spend)],['Leads',num(paid.leads)],
      ['Per lead',money(paid.cpl),paid.cpl<CPLB?'good':'bad'],
      ['Impressions',num(paid.impressions)],['People reached',num(paid.reach)],
      ['Frequency',paid.frequency?paid.frequency+'×':'—'],
      ['Clicks',num(paid.clicks)+(paid.ctr?' · '+paid.ctr+'%':'')],
      ['Link clicks',num(paid.link_clicks)],['Video views',num(paid.video_views)],
      ['CPM',money(paid.cpm)],['Comments on ads',num(paid.comments),paid.comments?'bad':null]]:[],
    verdict:paid?((paid.cpl&&paid.cpl<CPLB
      ?'Cheaper than every past campaign, so this front is working.'
      :'Above the benchmark. Creative is the lever, not budget.')
      +(paid.comments?' '+paid.comments+' people commented on an advert, which is a conversation nobody has had.':''))
      :'No figures came back. Check the Meta token before concluding anything.'});

  F.push({key:'social',label:'Organic',note:'Instagram, the page, and the dated cards',
    head:ig?num(ig.reach):num(bd.cards),headsub:ig?'Instagram reach':'cards dated',
    tone:bd.cards&&!bd.with_reading?'bad':'good',
    quick:[['Cards',num(bd.cards)],['Read at 72h',num(bd.with_reading)]],
    metrics:(ig?[['Instagram reach',num(ig.reach)],['Profile views',num(ig.profile_views)],
      ['Followers',num(ig.followers)],
      ['New followers',ig.new_followers==null?'—':num(ig.new_followers)],
      ['Engagement rate',ig.engagement_rate+'%'],
      ['Website clicks',num(ig.website_clicks),ig.website_clicks<5?'bad':null],
      ['Facebook fans',num(fb&&fb.fans)],['Facebook engagements',num(fb&&fb.page_engagements)],
      ['Facebook page views',num(fb&&fb.page_views)]]
      :[['Only held for the current month','—']])
      .concat([['Cards dated',num(bd.cards)],['Published',num(bd.published)],
      ['With a 72h reading',num(bd.with_reading),bd.cards&&!bd.with_reading?'bad':'good']])
      .concat(Object.keys(st).length?[['Still scheduled',num(st['Scheduled']||0),
        (st['Scheduled']||0)>5?'bad':null]]:[]),
    verdict:bd.cards&&!bd.with_reading
      ?'Nothing was read at 72 hours, so no format can be scored this month.'
      :'Formats can be ranked this month.'});

  F.push({key:'uploads',label:'By hand',note:"Sean's profile, LinkedIn and TikTok, uploaded by Valerie",
    head:num(tot.impressions),headsub:'profile impressions',
    tone:li.gap||tk.gap?'bad':'good',
    quick:[['Profile posts',num(tot.posts)],['Rate',tot.rate!=null?tot.rate+'%':'—']],
    metrics:[["Sean’s profile posts",num(tot.posts)],
      ['Profile impressions',num(tot.impressions),tot.impressions>5000?'good':null],
      ['Profile interactions',num(tot.interactions)],
      ['Profile rate',tot.rate!=null?tot.rate+'%':'—',tot.rate>=5?'good':null],
      ['LinkedIn posts',li.gap?'not in the file':num(li.rows),li.gap?'bad':null],
      ['TikTok videos',tk.gap?'not in the file':num(tk.rows),tk.gap?'bad':null],
      ['Last refreshed',esc(up.last_updated?String(up.last_updated).split('·')[0].trim():'—')]],
    verdict:(fbp.best?'Best on the profile: “'+esc(String(fbp.best.title).slice(0,70))
      +'…”, '+num(fbp.best.impressions)+' impressions. ':'')
      +(li.gap||tk.gap?'LinkedIn and TikTok are the wrong sheets, so neither can say which post worked.'
        :'All three exports are usable.')});

  F.push({key:'youtube',label:'YouTube',note:"Marissa's long-form, the source for every cut",
    head:num(rec.length),headsub:'recordings in hand',
    tone:rec.length?'good':'bad',
    quick:[['Subscribers',num(yt.subs)],['Videos',num(yt.videos_total)]],
    metrics:[['Subscribers',num(yt.subs)],['Views, all time',num(yt.views_total)],
      ['Videos on the channel',num(yt.videos_total)],['Recordings in hand',num(rec.length)]]
      .concat(rec.slice(0,4).map(v=>['· '+esc(String(v.title).slice(0,34))+'…',num(v.views)+' views'])),
    verdict:top?'Most watched: “'+esc(top.title)+'”. These are the source for every social cut.'
      :'No recordings read this month.'});

  F.push({key:'funnel',label:'Funnel',note:'GetResponse, HubSpot and Zoom',
    head:money(fn.won_this_month),headsub:'won this month',
    tone:fn.won_this_month?'good':'bad',
    quick:[['Leads',num(lc.lead)],['Customers',num(lc.customer)]],
    metrics:[['Subscribers',num(lc.subscriber)],['Leads',num(lc.lead)],
      ['Marketing qualified',num(lc.marketingqualifiedlead)],
      ['Sales qualified',num(lc.salesqualifiedlead)],['Customers',num(lc.customer)],
      ['From this campaign',num(fn.from_campaign)],
      ['Won this month',money(fn.won_this_month),fn.won_this_month?'good':'bad'],
      ['Won, all time',money(fn.won_total)],['Open pipeline',money(fn.open_total)],
      ['Webinar attendees',num(fn.webinar_attendees),
        !fn.webinar_attendees&&fn.webinar_sessions?'bad':null]],
    verdict:fn.won_this_month?'Money came through this month.'
      :'Nothing closed. The gap is after the form, so nothing upstream is worth optimising.'});

  const r=d.read||{},dz=r.directions||{};
  return {built:d.built||'',fronts:F,read:r.lines||[],
    dirs:[['Marissa','what to produce',dz.marissa],['Valerie','what changes',dz.valerie],
          ['Marina','paid and the funnel',dz.marina]].filter(x=>x[2]),
    plan:d.plan||null,
    kpis:[['Spend',money(paid&&paid.spend),null],
          ['Leads',num(paid&&paid.leads),null],
          ['Per lead',paid&&paid.cpl?money(paid.cpl):'—',
            paid&&paid.cpl&&paid.cpl<CPLB?'good':'bad'],
          ['Cards read',num(bd.with_reading)+'/'+num(bd.cards),
            bd.cards&&!bd.with_reading?'bad':'good'],
          ['Won',money(fn.won_this_month),fn.won_this_month?'good':'bad']]};
}

const SAYS=[['marissa','Marissa','YouTube, and what is already recorded',
   'What you would change, what is worth repeating, and what is recorded and waiting.'],
  ['valerie','Valerie','social, and what travelled',
   'Which posts worked, which did not, and anything the cards got wrong.'],
  ['marina','Marina','anything the rules missed','Notes that belong with this month’s record.']];

function rows(){
  return Object.keys(ALL).sort().reverse().map(m=>{
    const d=ALL[m]||{},paid=((d.fronts||{}).paid||{}).data||{},
      bd=(((d.fronts||{}).social||{}).data||{}).board||{},p=d.plan||{};
    return {m:m,label:nice(m),leads:num(paid.leads),
      cpl:paid.cpl?money(paid.cpl):'—',
      cards:num(bd.cards)+(bd.cards?' · '+num(bd.with_reading)+' read':''),
      lines:((d.read||{}).lines||[]).length,plan:p.url?p:null};
  });
}

const timers={};
function mark(k,v){document.querySelectorAll('[data-s="'+k+'"]').forEach(s=>{
  s.textContent=v&&v.trim()?'in':'empty';s.classList.toggle('in',!!(v&&v.trim()));});}

async function save(path,value){
  try{
    const r=await fetch(FB+'/'+CUR+'.json',{method:'PATCH',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({[path]:value})});
    if(!r.ok) throw new Error('bad status');
    ALL[CUR]=Object.assign({},ALL[CUR],{[path]:value});
  }catch(e){fail();}
}

function wire(){
  document.querySelectorAll('textarea[data-k]').forEach(el=>{
    const k=el.dataset.k,cur=ALL[CUR]||{};
    el.value=(cur[k]&&cur[k].text)||'';mark(k,el.value);
    el.oninput=()=>{clearTimeout(timers[k]);
      document.querySelectorAll('[data-s="'+k+'"]').forEach(s=>{
        s.textContent='typing';s.classList.remove('in');});
      timers[k]=setTimeout(async()=>{
        await save(k,{text:el.value,saved:new Date().toISOString()});mark(k,el.value);},1000);};
  });
  const pu=document.getElementById('planurl');
  if(pu){
    pu.value=((ALL[CUR]||{}).plan||{}).url||'';
    pu.oninput=()=>{clearTimeout(timers.plan);
      timers.plan=setTimeout(async()=>{
        const v=pu.value.trim();if(!v)return;
        await save('plan',{url:v,title:(((ALL[CUR]||{}).plan)||{}).title||nice(CUR)+' plan'});
        render();wire();},1200);};
  }
}

/* localStorage is a per-viewer convenience: it can throw, and the page renders the same without it. */
function keep(k,v){try{localStorage.setItem('skles-ux-'+k,v);}catch(e){}}
function kept(k){try{return localStorage.getItem('skles-ux-'+k);}catch(e){return null;}}

function show(m){CUR=m;const p=document.getElementById('pick');if(p)p.value=m;render();wire();}

(async function init(){
  try{const r=await fetch(FB+'.json');if(r.ok)ALL=(await r.json())||{};}catch(e){fail();}
  const months=Object.keys(ALL).sort().reverse();
  if(!months.length){fail();return;}
  const p=document.getElementById('pick');
  if(p){p.innerHTML=months.map(m=>'<option value="'+m+'">'+nice(m)+'</option>').join('');
    p.onchange=e=>show(e.target.value);}
  start(months);
})();


function frontCard(f,cls){
  return '<div class="'+(cls||'card')+' t-'+f.key+'">'
    +'<div class="fh"><h3>'+esc(f.label)+'</h3><span class="dot '+(f.tone||'')+'"></span></div>'
    +'<div class="hero"><b'+(f.tone?' class="'+f.tone+'"':'')+'>'+f.head+'</b><span>'
    +esc(f.headsub)+'</span></div>'
    +f.metrics.map(m=>'<div class="mrow"><span>'+m[0]+'</span><b'+(m[2]?' class="'+m[2]+'"':'')
      +'>'+m[1]+'</b></div>').join('')
    +'<p class="verdict">'+f.verdict+'</p></div>';
}
function readHTML(M){
  return (M.read.length?M.read:[{front:'—',rule:'none',
    text:'No read was built for this month.'}]).map(l=>
    '<div class="rl"><div class="rule">'+esc(l.front)+' &middot; '+esc(l.rule)+'</div><p>'
    +esc(l.text)+'</p></div>').join('');
}
function dirsHTML(M){
  return M.dirs.length?M.dirs.map(x=>'<div class="d"><h3>'+x[0]+' <em>&middot; '+x[1]
    +'</em></h3><p>'+esc(x[2])+'</p></div>').join('')
    :'<p class="hint">No direction was derived for this month.</p>';
}
function saysHTML(){
  return SAYS.map(s=>'<div class="box"><div class="bh"><h3>'+s[1]+'</h3><span class="role">'+s[2]
    +'</span><span class="state" data-s="'+s[0]+'">empty</span></div><textarea data-k="'+s[0]
    +'" placeholder="'+s[3]+'"></textarea></div>').join('')
    +'<p class="hint">Saves on its own a second after you stop typing. Everyone sees the same page.</p>';
}
function planHTML(M){
  return '<div class="plan">'+(M.plan&&M.plan.url
    ?'<a href="'+esc(M.plan.url)+'">'+esc(M.plan.title||'The plan')+'</a>'
    :'<span style="color:var(--muted);font-size:14px">Not built yet.</span>')
  +'</div><input class="url" id="planurl" placeholder="https://..." aria-label="Plan link">'
  +'<p class="hint">Paste the plan’s link here once it is built and it joins the record.</p>';
}
function histHTML(){
  return '<div class="sheet"><table><thead><tr><th>Month</th><th>Leads</th><th>Per lead</th>'
    +'<th>Cards</th><th>Read</th><th>Plan</th></tr></thead><tbody>'
    +rows().map(r=>'<tr><td><a href="#" data-go="'+r.m+'">'+r.label+'</a></td><td>'+r.leads
      +'</td><td>'+r.cpl+'</td><td>'+r.cards+'</td><td>'+(r.lines?r.lines+' lines':'—')
      +'</td><td>'+(r.plan?'<a href="'+esc(r.plan.url)+'">'+esc(r.plan.title||'Plan')+'</a>'
        :'—')+'</td></tr>').join('')+'</tbody></table></div>';
}
function goWire(){document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{
  e.preventDefault();show(a.dataset.go);});}

const STEPS=[
  {when:'26th',nm:'The numbers',who:'pulled, nobody writes them',
   task:'Every front as the APIs returned it. If a figure looks wrong, say so at step three, '
     +'because then it is wrong for all of us.'},
  {when:'26th',nm:'Our read',who:'Marina',
   task:'What the figures say, worked out by rule rather than by impression, and the one change '
     +'each of us takes from it.'},
  {when:'27th–28th',nm:'Your read',who:'Marissa and Valerie',
   task:'Where the direction is wrong, or where it is missing something only you can see. This is '
     +'the step the plan gets built from.'},
  {when:'29th–30th',nm:'The plan',who:'Marina, then one email on the 1st',
   task:'Built from all three reads, out of material that already exists, and sent to Sean as a '
     +'single email. Nobody writes to him separately.'}];

let STEP=+(kept('k3s')||0),SEL=kept('k3f')||'paid';
if(!(STEP>=0&&STEP<4))STEP=0;

function fbtn(f){
  return '<button class="it t-'+(f.key===SEL?'':f.key)+'" data-id="'+f.key+'" aria-current="'
    +(f.key===SEL)+'"><span class="nm"><span class="dot '+(f.tone||'')+'"></span>'+esc(f.label)
    +'</span><span class="fig">'+f.head+'</span><span class="sb">'+esc(f.headsub)+'</span></button>';
}

function body(M){
  if(STEP===0){
    const f=M.fronts.filter(x=>x.key===SEL)[0]||M.fronts[0];
    return '<div class="strip">'+M.kpis.map(k=>'<div class="kp"><b'
      +(k[2]?' class="'+k[2]+'"':'')+'>'+k[1]+'</b><span>'+k[0]+'</span></div>').join('')+'</div>'
      +'<div class="two"><nav class="list" aria-label="Fronts"><div class="lh">Five fronts</div>'
      +M.fronts.map(fbtn).join('')+'</nav><div>'+frontCard(f,'card')+'</div></div>';
  }
  if(STEP===1) return '<div class="wide">'+readHTML(M)+'<div style="margin-top:16px">'
    +dirsHTML(M)+'</div></div>';
  if(STEP===2) return '<div class="wide">'+saysHTML()+'</div>';
  return '<div class="wide">'+planHTML(M)+'</div><div style="margin-top:26px">'+histHTML()+'</div>';
}

function render(){
  const M=model(ALL[CUR]||{}),s=STEPS[STEP];
  document.getElementById('title').textContent=nice(CUR)+' review';
  document.getElementById('built').textContent=M.built?'Numbers as at '+M.built:'';
  document.getElementById('fill').style.width=((STEP+1)/4*100)+'%';
  document.getElementById('steps').innerHTML=STEPS.map((x,i)=>'<button class="sp" data-i="'+i
    +'" data-state="'+(i<STEP?'done':i===STEP?'now':'next')+'"><span class="when">'+x.when
    +'</span><span class="nm">'+x.nm+'</span></button>').join('');
  document.getElementById('stage').innerHTML='<div class="sh"><h2>'+s.nm+'</h2><span class="who">'
    +s.who+'</span></div><p class="task">'+s.task+'</p>'+body(M);
  document.getElementById('of').textContent='Step '+(STEP+1)+' of 4 · '+s.when;
  document.getElementById('prev').disabled=STEP===0;
  document.getElementById('next').disabled=STEP===3;
  document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>jump(+b.dataset.i));
  document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{
    SEL=b.dataset.id;keep('k3f',SEL);render();wire();});
  goWire();
}
function jump(i){STEP=Math.max(0,Math.min(3,i));keep('k3s',STEP);render();wire();}
document.getElementById('prev').onclick=()=>jump(STEP-1);
document.getElementById('next').onclick=()=>jump(STEP+1);
document.addEventListener('keydown',e=>{
  if(STEP!==0||(e.key!=='ArrowDown'&&e.key!=='ArrowUp'))return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||''))return;
  const ids=[].slice.call(document.querySelectorAll('.it')).map(b=>b.dataset.id);
  const i=ids.indexOf(SEL);if(i<0)return;
  e.preventDefault();
  SEL=ids[(i+(e.key==='ArrowDown'?1:ids.length-1))%ids.length];
  keep('k3f',SEL);render();wire();
});
function start(months){show(months[0]);}

</script>
</body>
</html>
